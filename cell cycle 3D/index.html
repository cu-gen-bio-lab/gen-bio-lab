<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: one-screen app. Top half = dark "microscope field" 3D viewer, bottom half = scrolling lesson/quiz panel. */
:root{
  --bg:#f2f3f8; --surface:#ffffff; --ink:#161a2c; --muted:#596079; --line:#dde0ea;
  --accent:#4a37a6; --accent-ink:#ffffff; --accent-soft:#ebe8fb;
  --ok:#17845a; --ok-soft:#e2f4ec; --bad:#c23447; --bad-soft:#fbe7ea;
  --field:#060a13; --field-ink:#dfe6ff; --field-muted:#8d97b8;
  --f-display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d111d; --surface:#151a2a; --ink:#e7e9f3; --muted:#9aa1bb; --line:#262c42;
  --accent:#b3a5ff; --accent-ink:#151027; --accent-soft:#241f42;
  --ok:#4fd29b; --ok-soft:#12302a; --bad:#ff7d8c; --bad-soft:#3a1a22; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d111d; --surface:#151a2a; --ink:#e7e9f3; --muted:#9aa1bb; --line:#262c42;
  --accent:#b3a5ff; --accent-ink:#151027; --accent-soft:#241f42;
  --ok:#4fd29b; --ok-soft:#12302a; --bad:#ff7d8c; --bad-soft:#3a1a22; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;overflow:hidden}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:grid;grid-template-rows:minmax(220px,1fr) minmax(240px,1fr)}
/* ---------- viewer ---------- */
#viewer{position:relative;background:var(--field);overflow:hidden;touch-action:none;color:var(--field-ink)}
#gl{display:block;width:100%;height:100%;cursor:grab}
#gl:active{cursor:grabbing}
.v-top{position:absolute;top:10px;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.v-tag{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.04em;background:rgba(10,16,32,.72);border:1px solid rgba(160,180,255,.18);padding:4px 10px;border-radius:6px;backdrop-filter:blur(4px)}
.v-tag small{font-family:var(--f-mono);font-weight:400;color:var(--field-muted);margin-left:6px}
.v-actions{display:flex;gap:6px;pointer-events:auto}
.vbtn{width:34px;height:34px;border-radius:8px;border:1px solid rgba(160,180,255,.22);background:rgba(10,16,32,.72);color:var(--field-ink);display:grid;place-items:center;cursor:pointer}
.vbtn svg{width:18px;height:18px}
.vbtn.wide{width:auto;padding:0 10px;display:inline-flex;gap:6px;font-size:12.5px;white-space:nowrap}
.vbtn[aria-pressed="true"]{background:rgba(120,100,255,.35);border-color:rgba(190,180,255,.6)}
.v-legend{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:10px;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--field-muted);pointer-events:none;max-width:70%}
.v-legend span{display:inline-flex;align-items:center;gap:5px}
.v-legend i{display:inline-block;width:14px;height:6px;border-radius:3px}
.v-hint{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:10px;font-size:11px;color:var(--field-muted);pointer-events:none;text-align:right}
#labels{position:absolute;inset:0;pointer-events:none}
.lbl{position:absolute;transform:translate(-50%,-100%);font-size:11.5px;white-space:nowrap;color:#fff;background:rgba(14,20,40,.78);border:1px solid rgba(200,210,255,.3);padding:1px 7px;border-radius:5px;margin-top:-8px}
.lbl::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:8px;background:rgba(220,230,255,.6)}
/* ---------- panel ---------- */
#panel{overflow-y:auto;overscroll-behavior:contain;border-top:1px solid var(--line);background:var(--bg)}
.bar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex-wrap:wrap}
.tabs{display:flex;gap:4px;background:var(--bg);padding:3px;border-radius:9px;border:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:5px 12px;border-radius:7px;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.bar-right{display:flex;align-items:center;gap:8px;min-width:0}
.who{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.who b{color:var(--ink);font-weight:600}
.lang{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:3px 9px;font-family:var(--f-mono);font-size:12px;cursor:pointer}
.wrap{padding-block:14px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.transport{display:flex;gap:6px}
.tbtn{height:38px;min-width:38px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-size:13.5px}
.tbtn svg{width:16px;height:16px;fill:currentColor}
.tbtn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);min-width:54px}
.tbtn:disabled{opacity:.4;cursor:default}
.scrub{flex:1 1 180px;display:flex;align-items:center;gap:8px;min-width:0}
.scrub input{flex:1;min-width:0;accent-color:var(--accent)}
.scrub output{font-family:var(--f-mono);font-size:12px;color:var(--muted);width:3.2em;text-align:right;font-variant-numeric:tabular-nums}
.opts{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
.opts select{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:3px 6px}
.opts label{display:inline-flex;gap:5px;align-items:center;cursor:pointer}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end}
.steps .grp{display:flex;flex-direction:column;gap:3px;border:1px dashed var(--line);border-radius:9px;padding:3px 4px 4px}
.steps .grp>span{font-size:11px;color:var(--muted);padding-left:4px;font-family:var(--f-display);letter-spacing:.04em}
.steps .grp>div{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:3px 9px;font-size:12.5px;cursor:pointer;display:inline-flex;gap:6px;align-items:baseline;color:var(--muted)}
.chip b{font-family:var(--f-mono);font-weight:500;font-size:11px}
.chip[aria-current="step"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.chip.done{color:var(--ink)}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.stage h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(24px,4.2vw,34px);line-height:1.15;text-wrap:balance}
.stage h2 small{display:block;font-family:var(--f-mono);font-weight:400;font-size:13px;color:var(--muted);letter-spacing:.02em;margin-top:2px}
.sub{margin:0;color:var(--muted);font-size:14px}
.cols{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}
.cols>*{min-width:0}
.cols p{margin:0;max-width:66ch}
.observe{border-left:2px solid var(--accent-soft);padding-left:14px}
.observe h3,.q-sec h3{margin:0 0 4px;font-family:var(--f-display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.observe ul{margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:3px}
details{border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:14px;color:var(--accent)}
details p{margin:8px 0 0;font-size:14px;color:var(--ink);max-width:72ch}
.cta{display:flex;justify-content:flex-end}
.cta button{border:0;background:var(--accent);color:var(--accent-ink);padding:9px 16px;border-radius:9px;font-family:var(--f-display);font-weight:600;cursor:pointer}
@media (max-width:640px){.cols{grid-template-columns:1fr}.observe{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:8px}.stage{padding:14px}.opts{flex-wrap:wrap}.opts label{white-space:nowrap}}
/* ---------- quiz ---------- */
.q-head h2{margin:0;font-family:var(--f-display);font-size:26px}
.q-head p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.q-sec{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.q-desc{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px 14px;font-size:13.5px}
.q-desc li{display:flex;gap:8px;min-width:0}
.q-desc b{font-family:var(--f-mono);color:var(--accent);flex:none}
.q-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.q-card{border:1px solid var(--line);border-radius:9px;padding:8px;display:flex;flex-direction:column;gap:6px;background:var(--bg);min-width:0}
.q-card.focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.q-img{position:relative;border:0;padding:0;border-radius:6px;overflow:hidden;cursor:pointer;background:var(--field);aspect-ratio:4/3;max-width:100%}
.q-img img{width:100%;height:100%;object-fit:cover;display:block}
.q-img span{position:absolute;left:6px;top:6px;font-family:var(--f-mono);font-size:11px;background:rgba(8,12,24,.8);color:#fff;padding:1px 6px;border-radius:4px}
.q-card label{display:flex;flex-direction:column;font-size:11.5px;color:var(--muted);gap:2px}
.q-card select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 6px;font-size:13px;color:var(--ink)}
.q-card select.empty{color:var(--muted)}
.q-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.q-actions button{border:0;background:var(--accent);color:var(--accent-ink);padding:10px 18px;border-radius:9px;font-family:var(--f-display);font-weight:600;cursor:pointer}
.q-actions button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.q-msg{font-size:13.5px;color:var(--bad)}
.res-top{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.res-who{display:flex;flex-direction:column;gap:2px;font-size:14px}
.res-who b{font-family:var(--f-display);font-size:18px}
.res-who span{color:var(--muted);font-family:var(--f-mono);font-size:12.5px}
.score{display:flex;align-items:baseline;gap:6px;font-family:var(--f-display)}
.score strong{font-size:44px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.score em{font-style:normal;color:var(--muted);font-size:18px}
.res-split{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-size:12.5px;border-radius:999px;padding:2px 10px;background:var(--accent-soft);color:var(--ink);font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-family:var(--f-display);font-weight:600;color:var(--muted);font-size:12px;letter-spacing:.04em}
td img{width:64px;height:48px;object-fit:cover;border-radius:4px;display:block;background:var(--field)}
.ok{color:var(--ok);font-weight:600}
.bad{color:var(--bad);font-weight:600}
.cor{display:block;color:var(--muted);font-size:12px}
/* compact quiz cards on phones: small thumbnail beside the two choices, big view stays in the 3D viewer */
@media (max-width:640px){
  .q-grid{grid-template-columns:1fr;gap:8px}
  .q-card{display:grid;grid-template-columns:92px minmax(0,1fr);column-gap:10px;row-gap:4px;align-items:center;padding:6px}
  .q-img{grid-row:1 / span 2;width:92px}
  .q-img span{font-size:10px;left:4px;top:4px;padding:0 4px}
  .q-card .ql{display:none}
  .q-card select{padding:3px 6px}
}
/* ---------- start screen ---------- */
.start{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(5,8,16,.55);backdrop-filter:blur(3px);padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-y:auto}
.start form{width:min(440px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.start h1{margin:0;font-family:var(--f-display);font-size:28px;line-height:1.15;text-wrap:balance}
.start .lead{margin:0;color:var(--muted);font-size:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px;cursor:pointer;font-family:var(--f-display);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.fld{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
.fld input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;color:var(--ink);font-size:15px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.start .go{border:0;background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:11px;font-family:var(--f-display);font-weight:700;font-size:16px;cursor:pointer}
.err{color:var(--bad);font-size:13px;min-height:1.2em;margin:0}
.kicker{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
@media (max-width:420px){.row2{grid-template-columns:1fr}}
@media (max-width:560px){.v-hint{display:none}.v-legend{max-width:none;right:12px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<div id="app">
  <section id="viewer" aria-label="3D cell viewer">

<script>
// ======================= CONTENT =======================
const UI = {
  th: {
    title: 'ห้องแล็บการแบ่งเซลล์ 3 มิติ', lead: 'สำรวจไมโทซิสและไมโอซิสแบบหมุนดูได้รอบทิศ แล้วทำแบบทดสอบจับคู่ภาพ ชื่อระยะ และคำอธิบาย',

        'Condensin II and then condensin I compact DNA by loop extrusion, driven by CDK1–cyclin B phosphorylation. In vertebrates most arm cohesin is removed by the prophase pathway (PLK1, WAPL), while centromeric cohesin is protected by shugoshin–PP2A. Kinesin-5 (Eg5) slides antiparallel microtubules to push the poles apart. In late prophase CDK1 phosphorylates lamins and nucleoporins, the lamina disassembles and nuclear envelope breakdown (NEBD) begins. Textbooks that use four mitotic stages count envelope breakdown and kinetochore capture as part of prophase; the five-stage scheme splits that later part off as prometaphase.'],

    { name: ['เมทาเฟส', 'Metaphase'], sub: ['โครโมโซมเรียงที่แนวกึ่งกลางเซลล์', 'Chromosomes align at the equator'],

      obs: [['โครมาทิดแยกเป็นสองกลุ่มเท่ากัน', 'แขนโครมาทิดลากตามเป็นรูปตัว V', 'เซลล์ยืดยาวออกตามแนวขั้ว'],
        ['Chromatids split into two equal groups', 'Chromatid arms trail behind in a V', 'The cell stretches along the pole-to-pole axis']],
      adv: ['แอนาเฟส A: ไคนีโทคอร์ไมโครทิวบูลสลายตัวที่ปลาย plus (Pac-Man) ร่วมกับ poleward flux ที่ขั้ว แอนาเฟส B: kinesin-5 เลื่อนไมโครทิวบูลโพลาร์ที่ซ้อนสวนกันออกจากกัน และ dynein ที่เปลือกเซลล์ดึงแอสเตอร์ การสลาย cyclin B ทำให้กิจกรรม CDK1 ลดลง เซลล์จึงออกจากไมโทซิส',
        'Anaphase A: kinetochore microtubules depolymerise at their plus ends (Pac-Man) together with poleward flux. Anaphase B: kinesin-5 slides overlapping polar microtubules apart and cortical dynein pulls on astral microtubules. Destruction of cyclin B lowers CDK1 activity, driving mitotic exit.'],
      labels: ['sister', 'kfiber', 'polar', 'pole'] },
    { name: ['เทโลเฟส', 'Telophase'], sub: ['สร้างนิวเคลียสใหม่ 2 นิวเคลียส', 'Two new nuclei form'],
      basic: ['โครมาทิดไปถึงขั้วเซลล์แล้วเริ่มคลายตัวกลับเป็นโครมาติน เยื่อหุ้มนิวเคลียสสร้างใหม่ล้อมโครโมโซมแต่ละกลุ่ม นิวคลีโอลัสกลับมาปรากฏ เส้นใยสปินเดิลสลายตัว และเยื่อหุ้มเซลล์ตรงกลางเริ่มคอดเข้าเป็นร่องแบ่งเซลล์ (cleavage furrow)',
        'The chromatids reach the poles and begin to uncoil back into chromatin. A new nuclear envelope forms around each group, nucleoli reappear, the spindle breaks down, and the membrane at the middle begins to pinch in as the cleavage furrow.'],
      obs: [['นิวเคลียสใหม่ 2 อันก่อตัวที่สองขั้ว', 'โครโมโซมคลายตัวบางลง', 'เยื่อหุ้มเซลล์เริ่มคอดตรงกลาง'],
        ['Two new nuclei form at the poles', 'Chromosomes uncoil and thin out', 'The membrane starts to pinch in at the middle']],
      adv: ['ฟอสฟาเทส PP1 และ PP2A–B55 ย้อนการฟอสโฟริเลตของ lamin และ nucleoporin ESCRT-III ช่วยปิดรอยต่อเยื่อหุ้มนิวเคลียส ส่วน central spindle (PRC1, centralspindlin) กำหนดตำแหน่งร่องแบ่งเซลล์โดยกระตุ้น RhoA ผ่าน Ect2',
        'PP1 and PP2A–B55 reverse the phosphorylation of lamins and nucleoporins, and ESCRT-III seals the reforming nuclear envelope. The central spindle (PRC1, centralspindlin) positions the furrow by activating RhoA through Ect2.'],
      labels: ['nucleus', 'furrow', 'ring', 'chromatin'] },
    { name: ['ไซโทไคนีซิส', 'Cytokinesis'], sub: ['แบ่งไซโทพลาซึม', 'The cytoplasm divides'],
      basic: ['วงแหวนหดตัว (contractile ring) ที่ประกอบด้วยแอกตินและไมโอซิน II ใต้เยื่อหุ้มเซลล์หดรัดเข้าเรื่อย ๆ จนเซลล์ขาดออกเป็นเซลล์ลูก 2 เซลล์ ที่มีจำนวนโครโมโซมเท่าเซลล์แม่ (2n) และเหมือนกันทางพันธุกรรม ในเซลล์พืชจะสร้างเซลล์เพลตกั้นกลางแทนการคอด',
        'A contractile ring of actin and myosin II beneath the membrane tightens until the cell is cut into two daughter cells. Each has the same chromosome number as the parent (2n) and is genetically identical to it. Plant cells build a cell plate across the middle instead of pinching in.'],
      obs: [['วงแหวนสีแดงหดรัดตรงกลาง', 'ได้ 2 เซลล์ แต่ละเซลล์มีโครโมโซม 4 แท่ง (2n = 4)', 'สีโครโมโซมในสองเซลล์เหมือนกันทุกประการ'],
        ['The red ring tightens at the middle', 'Two cells, each with 4 chromosomes (2n = 4)', 'Both cells carry exactly the same set of colours']],
      adv: ['RhoA กระตุ้น formin ให้สร้างแอกติน และ ROCK กระตุ้นไมโอซิน II สะพานไซโทพลาซึมที่เหลือ (midbody) ถูกตัดขาดด้วย ESCRT-III ในขั้นตอน abscission ในพืช เวสิเคิลจากกอลจิมารวมกันที่ phragmoplast เกิดเป็นเซลล์เพลตแล้วพัฒนาเป็นผนังเซลล์',
        'RhoA activates formins (actin assembly) and ROCK (myosin II activation). The remaining cytoplasmic bridge (midbody) is severed by ESCRT-III during abscission. In plants, Golgi vesicles fuse at the phragmoplast to form a cell plate that becomes the new wall.'],
      labels: ['ring', 'daughter', 'nucleus', 'centrosome'] }
  ],
  meiosis: [
    { name: ['อินเตอร์เฟส', 'Interphase'], sub: ['ก่อนไมโอซิส: จำลอง DNA 1 ครั้ง', 'Before meiosis: DNA copied once'],
      basic: ['เซลล์ต้นกำเนิดเซลล์สืบพันธุ์ (2n) จำลอง DNA เพียงครั้งเดียวก่อนจะแบ่งต่อเนื่องสองรอบ ในแบบจำลองนี้ 2n = 4 คือมีโครโมโซมคู่เหมือน (ฮอมอโลกัส) 2 คู่ สีชมพูมาจากแม่และสีน้ำเงินมาจากพ่อ โดยแต่ละคู่ต่างกันที่ขนาด (ยาวและสั้น)',
        'A germ-line cell (2n) copies its DNA only once before dividing twice in a row. In this model 2n = 4: two pairs of homologous chromosomes, with pink chromosomes from the mother and blue from the father; the two pairs differ in size (long and short).'],
      obs: [['ระยะ S: เส้นโครมาตินแต่ละเส้นจำลองเป็น 2 เส้น (เส้นใหม่แสดงเป็นสีอ่อนระหว่างจำลอง)', 'สีชมพูคือโครโมโซมจากแม่ สีน้ำเงินคือจากพ่อ (คู่ยาว 1 คู่ คู่สั้น 1 คู่)', 'เซนโทรโซมจำลองเป็น 2 อัน'],
        ['S phase: each chromatin thread is copied into two (the new strand shows lighter while it is copied)', 'Pink chromosomes come from the mother, blue from the father (one long pair, one short pair)', 'The centrosome duplicates']],
      adv: ['ระยะ S ก่อนไมโอซิสยาวกว่าระยะ S ของไมโทซิส และมีการโหลด cohesin ชนิดเฉพาะไมโอซิสคือ Rec8 ซึ่งจะถูกตัดออกเป็นสองจังหวะ ทำให้โครโมโซมแยกได้สองรอบ',
        'Pre-meiotic S phase is longer than a mitotic S phase, and the meiosis-specific cohesin subunit Rec8 is loaded; its removal in two steps later lets chromosomes separate in two rounds.'],
      labels: ['nucleus', 'chromatin', 'centrosome'] },
    { name: ['เลปโททีน', 'Leptotene'], sub: ['โพรเฟส I ระยะย่อยที่ 1: โครโมโซมเริ่มเห็นเป็นเส้นบาง', 'Prophase I, substage 1: thin threads appear'], group: 1,
      basic: ['โครโมโซมเริ่มขดตัวจนมองเห็นเป็นเส้นยาวบาง แม้ DNA จะจำลองแล้ว แต่ซิสเตอร์โครมาทิดยังแนบกันสนิทจนดูเหมือนเส้นเดียว ปลายโครโมโซม (เทโลเมียร์) เกาะกับเยื่อหุ้มนิวเคลียส',
        'Chromosomes start to condense and become visible as long thin threads. Although the DNA is already replicated, the sister chromatids lie so close together that each looks like a single thread. Chromosome ends (telomeres) attach to the nuclear envelope.'],
      obs: [['เส้นโครโมโซมยาวและบาง เริ่มแยกเป็นเส้น ๆ ได้', 'ฮอมอโลกัสยังอยู่ห่างกัน'],
        ['Long, thin chromosome threads become distinct', 'Homologues are still apart']],
      adv: ['เกิด axial element ตามแนวซิสเตอร์โครมาทิด เอนไซม์ Spo11 ตัด DNA สายคู่ (double-strand break) อย่างตั้งใจหลายร้อยตำแหน่ง ซึ่งเป็นจุดเริ่มของการรีคอมบิเนชัน ในหลายสิ่งมีชีวิตเทโลเมียร์รวมกลุ่มเป็น bouquet ช่วยให้ฮอมอโลกัสหากันพบ',
        'Axial elements form along each pair of sisters. Spo11 deliberately makes hundreds of DNA double-strand breaks, which start recombination. In many organisms telomeres cluster in a bouquet that helps homologues find each other.'],
      labels: ['chromosome', 'nucleus'] },
    { name: ['ไซโกทีน', 'Zygotene'], sub: ['โพรเฟส I ระยะย่อยที่ 2: ฮอมอโลกัสจับคู่ (ไซแนปซิส)', 'Prophase I, substage 2: homologues pair (synapsis)'], group: 1,
      basic: ['ฮอมอโลกัสโครโมโซมที่มาจากพ่อและแม่เข้ามาเรียงคู่กันแบบจุดต่อจุด เรียกว่า ไซแนปซิส (synapsis) โดยมีโครงสร้างโปรตีนซิแนปโทนีมัลคอมเพล็กซ์ (synaptonemal complex) รูดยึดทั้งสองแท่งเข้าหากันเหมือนซิป',
        'Homologous chromosomes from the father and the mother line up side by side, gene for gene. This pairing is synapsis, and a protein scaffold called the synaptonemal complex zips the two together.'],
      obs: [['โครโมโซมสีชมพูและสีน้ำเงินที่ยาวเท่ากันเคลื่อนมาคู่กัน', 'ขั้นบันไดสีขาวระหว่างคู่คือซิแนปโทนีมัลคอมเพล็กซ์'],
        ['Pink and blue chromosomes of the same length come together', 'The white ladder rungs between them are the synaptonemal complex']],
      adv: ['การค้นหาคู่อาศัยปลาย DNA ที่ถูกตัดบุกรุกเข้าหาโครโมโซมคู่เหมือน (strand invasion โดย Dmc1/Rad51) ซิแนปโทนีมัลคอมเพล็กซ์ประกอบด้วย lateral element สองข้าง transverse filament (SYCP1) และ central element',
        'Pairing relies on broken DNA ends invading the homologue (strand invasion by Dmc1/Rad51). The synaptonemal complex consists of two lateral elements, transverse filaments (SYCP1) and a central element.'],
      labels: ['sc', 'homolog'] },
    { name: ['แพคิทีน', 'Pachytene'], sub: ['โพรเฟส I ระยะย่อยที่ 3: ครอสซิงโอเวอร์', 'Prophase I, substage 3: crossing over'], group: 1,
      basic: ['ไซแนปซิสสมบูรณ์ ฮอมอโลกัสแต่ละคู่เรียกว่า ไบวาเลนต์ หรือ เทแทรด (มี 4 โครมาทิด) โครมาทิดที่ไม่ใช่พี่น้องกัน (non-sister) แลกเปลี่ยนชิ้นส่วนกัน เรียกว่า ครอสซิงโอเวอร์ (crossing over) ทำให้เกิดการรวมตัวใหม่ทางพันธุกรรม',
        'Synapsis is complete. Each homologous pair is now a bivalent, or tetrad, with four chromatids. Non-sister chromatids exchange segments in crossing over, producing new combinations of alleles.'],
      obs: [['จุดเรืองแสงคือตำแหน่งที่เกิดครอสซิงโอเวอร์', 'ปลายแขนโครมาทิดสลับสีกันระหว่างโครโมโซมจากพ่อและแม่'],
        ['The glowing point marks where crossing over happens', 'The arm tips of two chromatids swap colours between the paternal and maternal chromosome']],
      adv: ['รอยตัด DNA ถูกซ่อมผ่าน double Holliday junction แล้วแยกออกเป็น crossover โดย MutLγ (MLH1–MLH3) มี crossover interference และ crossover assurance (อย่างน้อย 1 จุดต่อไบวาเลนต์) ใต้กล้อง EM เห็นเป็น recombination nodule',
        'Breaks are repaired via double Holliday junctions that are resolved as crossovers by MutLγ (MLH1–MLH3). Crossover interference and assurance (at least one crossover per bivalent) shape their number and spacing; under EM they appear as recombination nodules.'],
      labels: ['crossover', 'bivalent', 'sc'] },
    { name: ['ดิโพลทีน', 'Diplotene'], sub: ['โพรเฟส I ระยะย่อยที่ 4: เห็นไคแอสมา', 'Prophase I, substage 4: chiasmata visible'], group: 1,
      basic: ['ซิแนปโทนีมัลคอมเพล็กซ์สลายไป ฮอมอโลกัสเริ่มแยกห่างออกจากกัน แต่ยังยึดกันอยู่ตรงจุดที่เกิดครอสซิงโอเวอร์ ซึ่งเห็นเป็นรูปกากบาทเรียกว่า ไคแอสมา (chiasma)',
        'The synaptonemal complex disassembles and the homologues begin to move apart, but they stay joined where crossing over happened. These cross-shaped connections are chiasmata.'],
      obs: [['ฮอมอโลกัสถอยห่างออกจากกัน', 'โครมาทิดไขว้กันเป็นรูป X ที่ไคแอสมา'],
        ['Homologues pull away from each other', 'Chromatids cross in an X at the chiasma']],
      adv: ['ไคแอสมาร่วมกับ cohesin บนแขนส่วนที่อยู่ถัดจากจุดไขว้ไปทางปลาย ยึดฮอมอโลกัสไว้ด้วยกัน ซึ่งจำเป็นต่อการเกาะสปินเดิลอย่างถูกต้องในเมทาเฟส I โอโอไซต์ปฐมภูมิของมนุษย์หยุดอยู่ที่ระยะนี้ (dictyate) ตั้งแต่ก่อนเกิดจนถึงการตกไข่',
        'Chiasmata, together with arm cohesin distal to them, hold homologues together, which is essential for correct spindle attachment in metaphase I. Human primary oocytes arrest at this stage (dictyate) from before birth until ovulation.'],
      labels: ['chiasma', 'homolog'] },
    { name: ['ไดอะคิเนซิส', 'Diakinesis'], sub: ['โพรเฟส I ระยะย่อยที่ 5: หดสั้นที่สุด เยื่อหุ้มนิวเคลียสสลาย', 'Prophase I, substage 5: maximum condensation, envelope breaks down'], group: 1,
      basic: ['โครโมโซมขดตัวสั้นและหนาที่สุด ยังเห็นไคแอสมาชัดเจน นิวคลีโอลัสหายไป เยื่อหุ้มนิวเคลียสสลาย เซนโทรโซมถึงขั้วเซลล์และสร้างเส้นใยสปินเดิล',
        'Chromosomes reach maximum condensation and the chiasmata are still clear. The nucleolus disappears, the nuclear envelope breaks down, and the centrosomes reach the poles and build the spindle.'],
      obs: [['ไบวาเลนต์หนาและสั้นที่สุด', 'เยื่อหุ้มนิวเคลียสแตกเป็นชิ้น', 'เส้นใยสปินเดิลเริ่มก่อตัว'],
        ['Bivalents are at their shortest and thickest', 'The nuclear envelope fragments', 'Spindle fibres begin to form']],
      adv: ['ไคแอสมาดูเหมือนเลื่อนไปทางปลายแขน (terminalization) ซึ่งเป็นผลจากการขดตัวมากขึ้น ไม่ใช่การเคลื่อนที่จริงของจุดแลกเปลี่ยน ช่วงท้ายของไดอะคิเนซิสตรงกับโพรเมทาเฟส I',
        'Chiasmata appear to slide toward the chromosome ends (terminalization), an effect of further condensation rather than real movement of the exchange point. The end of diakinesis corresponds to prometaphase I.'],
      labels: ['chiasma', 'vesicle', 'centrosome'] },
    { name: ['เมทาเฟส I', 'Metaphase I'], sub: ['ฮอมอโลกัสเรียงเป็นคู่', 'Homologues line up in pairs'],
      basic: ['ไบวาเลนต์เรียงตัวเป็นคู่ ๆ ที่แนวเมทาเฟสเพลต ไคนีโทคอร์ของซิสเตอร์โครมาทิดทั้งสองแท่งในโครโมโซมเดียวกันเกาะกับเส้นใยจากขั้วเดียวกัน ส่วนฮอมอโลกัสอีกแท่งหันไปขั้วตรงข้าม การหันของแต่ละคู่เป็นแบบสุ่ม เรียกว่า การจัดเรียงอย่างอิสระ (independent assortment)',
        'Bivalents line up in pairs on the metaphase plate. Both sister kinetochores of one homologue attach to fibres from the same pole, and its partner faces the opposite pole. Each pair orients at random, which is independent assortment.'],
      obs: [['โครโมโซมเรียงเป็นคู่ ไม่ใช่เรียงเดี่ยว', 'คู่ยาว: ของแม่หันซ้าย ส่วนคู่สั้น: ของแม่หันขวา (สุ่ม)', 'ซิสเตอร์โครมาทิดทั้งสองหันไปขั้วเดียวกัน'],
        ['Chromosomes line up as pairs, not singly', 'Long pair: maternal faces left; short pair: maternal faces right (random)', 'Both sister chromatids face the same pole']],
      adv: ['ไคนีโทคอร์พี่น้องทำงานเป็นหน่วยเดียว (mono-orientation; monopolin ในยีสต์, MEIKIN ในสัตว์เลี้ยงลูกด้วยนม) แรงตึงเกิดได้เพราะไคแอสมาต้านไว้ จำนวนแบบการจัดเรียงที่เป็นไปได้ = 2ⁿ เช่น มนุษย์ n = 23 ได้ 2²³ ≈ 8.4 ล้านแบบ',
        'Sister kinetochores act as one unit (mono-orientation; monopolin in yeast, MEIKIN in mammals), and tension is possible only because chiasmata resist the pull. The number of possible orientations is 2ⁿ; for humans (n = 23) that is 2²³ ≈ 8.4 million.'],
      labels: ['plate', 'bivalent', 'kinetochore'] },
    { name: ['แอนาเฟส I', 'Anaphase I'], sub: ['ฮอมอโลกัสแยกจากกัน', 'Homologues separate'],
      basic: ['ฮอมอโลกัสโครโมโซมแต่ละคู่แยกออกจากกันไปยังขั้วตรงข้าม โดยซิสเตอร์โครมาทิดยังติดกันที่เซนโทรเมียร์ จำนวนโครโมโซมต่อขั้วจึงลดลงครึ่งหนึ่ง (2n → n) และเห็นโครมาทิดที่มีสีผสมจากครอสซิงโอเวอร์',
        'Homologues separate and move to opposite poles while sister chromatids stay joined at the centromere. Each pole receives half the chromosome number (2n → n), and the recombinant chromatids with mixed colours become visible.'],
      obs: [['แต่ละขั้วได้โครโมโซม 2 แท่ง (แต่ละแท่งยังมี 2 โครมาทิด)', 'ไคแอสมาคลายออก', 'โครมาทิดบางแท่งมีปลายแขนต่างสีจากตัว'],
        ['Each pole receives 2 chromosomes (each still 2 chromatids)', 'Chiasmata release', 'Some chromatids have arm tips of a different colour']],
      adv: ['separase ตัด Rec8 เฉพาะบนแขน ส่วน Rec8 ที่เซนโทรเมียร์ถูกปกป้องโดย shugoshin (SGO2 ในสัตว์เลี้ยงลูกด้วยนม) ร่วมกับ PP2A ความผิดพลาดในขั้นนี้ทำให้เกิด nondisjunction เช่น ทริโซมี 21 ส่วนใหญ่เกิดจากไมโอซิส I ของแม่',
        'Separase cleaves Rec8 only on the arms; centromeric Rec8 is protected by shugoshin (SGO2 in mammals) with PP2A. Errors here cause nondisjunction; most cases of trisomy 21 arise in maternal meiosis I.'],

  $('stAdv').textContent = s.adv[L];
  const last = app.stage === N - 1;
  $('ctaBox').hidden = !last;
  if (last) $('ctaBtn').textContent = app.proc === 'mitosis' ? tx('toMei') : tx('toQuiz');
  $('bPrev').disabled = app.stage === 0; $('bNext').disabled = last;

}
function updatePlayBtn() {

  const b = $('bPlay');
  b.innerHTML = (app.playing ? ICON_PAUSE : ICON_PLAY) + `<span>${app.playing ? tx('pause') : atEnd ? tx('replay') : tx('play')}</span>`;
}
function updateScrub() {

}
function goStage(k, play = true) {

}
function setMode(m) {

}

// ---------- quiz ----------
function shuffle(a) { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
function newQuiz() {

}
let thumbs = null;
function ensureThumbs() {

}
function enterQuiz() {

  $('lesson').hidden = true; $('quiz').hidden = false;

  $('panel').scrollTop = 0;
}
function secTitle(si) { return si === 0 ? tx('sec1') : tx('sec2'); }
function thumb(proc, orig) { return thumbs && thumbs[proc] ? thumbs[proc][orig] : ''; }
function focusQuiz(si, di) {

  document.querySelectorAll('.q-card').forEach(c => c.classList.toggle('focus', +c.dataset.si === si && +c.dataset.di === di));
  $('vTag').innerHTML = esc(tx('quizTag')(di + 1, secTitle(si)));
}
function renderQuiz() {
  const q = app.quiz; if (!q) return;
  if (q.result) return renderResult();
  const L = Li();
  let html = `<div class="q-head"><h2>${esc(tx('qTitle'))}</h2><p>${esc(tx('qLead'))}</p></div>`;
  q.secs.forEach((sec, si) => {
    const data = QUIZ[sec.proc];

    html += `<ol class="q-desc">${sec.descOrder.map((o, p) => `<li><b>${LETTERS[p]}</b><span>${esc(data[o].desc[L])}</span></li>`).join('')}</ol>`;
    html += `<div class="q-grid">`;
    sec.items.forEach((orig, di) => {
      const a = sec.ans[di];
      const nameOpts = sec.nameOrder.map(o => `<option value="${o}"${String(a.name) === String(o) ? ' selected' : ''}>${esc(data[o].name[L])}</option>`).join('');
      const descOpts = sec.descOrder.map((o, p) => `<option value="${o}"${String(a.desc) === String(o) ? ' selected' : ''}>${LETTERS[p]}</option>`).join('');
      html += `<article class="q-card" data-si="${si}" data-di="${di}">
        <button type="button" class="q-img" data-si="${si}" data-di="${di}" aria-label="${esc(tx('img')(di + 1))}"><img alt="" src="${thumb(sec.proc, orig)}"><span>${esc(tx('img')(di + 1))}</span></button>
        <label><span class="ql">${esc(tx('pickName'))}</span><select aria-label="${esc(tx('pickName'))}" id="qn-${si}-${di}" data-si="${si}" data-di="${di}" data-f="name" class="${a.name === '' ? 'empty' : ''}"><option value="">— ${esc(tx('pickName'))} —</option>${nameOpts}</select></label>
        <label><span class="ql">${esc(tx('pickDesc'))}</span><select aria-label="${esc(tx('pickDesc'))}" id="qd-${si}-${di}" data-si="${si}" data-di="${di}" data-f="desc" class="${a.desc === '' ? 'empty' : ''}"><option value="">— ${esc(tx('pickDesc'))} —</option>${descOpts}</select></label>
      </article>`;
    });
    html += `</div></section>`;
  });
  html += `<div class="q-actions"><button type="button" id="qSubmit">${esc(tx('submit'))}</button><span class="q-msg" id="qMsg" role="status"></span></div>`;
  $('quiz').innerHTML = html;
  if (app.focus) focusQuiz(app.focus.si, app.focus.di);
}
function submitQuiz() {
  const q = app.quiz; let empty = 0;
  q.secs.forEach(s => s.ans.forEach(a => { if (a.name === '') empty++; if (a.desc === '') empty++; }));
  if (empty) { $('qMsg').textContent = tx('missing')(empty); return; }
  let total = 0, max = 0; const perSec = [];
  q.secs.forEach(s => {
    let got = 0;
    s.items.forEach((orig, di) => { const a = s.ans[di]; if (+a.name === orig) got++; if (+a.desc === orig) got++; });
    perSec.push({ got, max: s.items.length * 2 }); total += got; max += s.items.length * 2;
  });
  q.result = { at: new Date(), total, max, perSec };
  app.focus = null; app.dirty = true;
  renderResult(); $('panel').scrollTop = 0;
}
function renderResult() {
  const q = app.quiz, r = q.result, L = Li(), st = app.student || { first: '', last: '', id: '' };
  const when = r.at.toLocaleString(app.lang === 'th' ? 'th-TH' : 'en-GB', { dateStyle: 'medium', timeStyle: 'short' });
  const pct = Math.round(r.total / r.max * 100);
  let html = `<div class="res-top">
    <div class="res-who"><span class="kicker">${esc(tx('result'))}</span><b>${esc(st.first)} ${esc(st.last)}</b><span>${esc(tx('studentId'))} ${esc(st.id)} · ${esc(tx('submittedAt'))} ${esc(when)}</span></div>
    <div><div class="score"><strong>${r.total}</strong><em>/ ${r.max} · ${pct}%</em></div>
    <div class="res-split">${r.perSec.map((p, si) => `<span class="pill">${esc(tx('secScore')(secTitle(si), p.got, p.max))}</span>`).join('')}</div></div></div>`;
  q.secs.forEach((s, si) => {
    const data = QUIZ[s.proc];
    html += `<section class="q-sec"><h3>${esc(secTitle(si))}</h3><div class="tbl-wrap"><table><thead><tr><th>${esc(tx('colImg'))}</th><th>${esc(tx('colName'))}</th><th>${esc(tx('colDesc'))}</th></tr></thead><tbody>`;
    s.items.forEach((orig, di) => {
      const a = s.ans[di], nOk = +a.name === orig, dOk = +a.desc === orig;
      const myLetter = LETTERS[s.descOrder.indexOf(+a.desc)], okLetter = LETTERS[s.descOrder.indexOf(orig)];
      html += `<tr><td><button type="button" class="q-img" data-si="${si}" data-di="${di}" style="width:64px;aspect-ratio:4/3"><img alt="${esc(tx('img')(di + 1))}" src="${thumb(s.proc, orig)}"></button></td>
        <td><span class="${nOk ? 'ok' : 'bad'}">${nOk ? '✓' : '✗'} ${esc(data[+a.name].name[L])}</span>${nOk ? '' : `<span class="cor">${esc(tx('correctIs'))}${esc(data[orig].name[L])}</span>`}</td>
        <td><span class="${dOk ? 'ok' : 'bad'}">${dOk ? '✓' : '✗'} ${myLetter}. ${esc(data[+a.desc].desc[L])}</span>${dOk ? '' : `<span class="cor">${esc(tx('correctIs'))}${okLetter}. ${esc(data[orig].desc[L])}</span>`}</td></tr>`;
    });
    html += `</tbody></table></div></section>`;
  });
  html += `<div class="q-actions">${downloadsApi ? `<button type="button" id="qSave">${esc(tx('saveSheet'))}</button>` : ''}<button type="button" class="${downloadsApi ? 'ghost' : ''}" id="qRetry">${esc(tx('retry'))}</button><button type="button" class="ghost" id="qBack">${esc(tx('back'))}</button><span class="q-msg" id="qSaveMsg" role="status"></span></div>`;
  $('quiz').innerHTML = html;
  $('vTag').innerHTML = esc(tx('result'));
}

// ---------- answer sheet export (JPG, no answer key) ----------
let downloadsApi = null;
try { if (window.claude && typeof window.claude.use === 'function') window.claude.use('downloads').then(d => { downloadsApi = d; if (d && app.mode === 'quiz' && app.quiz && app.quiz.result) renderResult(); }).catch(() => {}); } catch (e) {}
function loadImg(src) { return new Promise(res => { if (!src) return res(null); const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; }); }
function wrapText(ctx, text, maxW) {
  const seg = (typeof Intl !== 'undefined' && Intl.Segmenter) ? [...new Intl.Segmenter(app.lang, { granularity: 'word' }).segment(text)].map(s => s.segment) : [...text];
  const lines = []; let line = '';
  for (const w of seg) { const t = line + w; if (ctx.measureText(t).width > maxW && line) { lines.push(line.trimEnd()); line = w.trimStart(); } else line = t; }
  if (line) lines.push(line);
  return lines;
}
async function buildSheet() {
  const q = app.quiz, r = q.result, L = Li(), st = app.student || { first: '', last: '', id: '' };
  try { await document.fonts.ready; } catch (e) {}
  const W = 1240, PAD = 72, F = '"IBM Plex Sans Thai", "Bai Jamjuree", sans-serif', FD = '"Bai Jamjuree", "IBM Plex Sans Thai", sans-serif';
  const imgs = {}; for (const s of q.secs) imgs[s.proc] = await Promise.all(s.items.map(o => loadImg(thumb(s.proc, o))));
  const measure = document.createElement('canvas').getContext('2d');
  measure.font = `22px ${F}`;
  const rows = q.secs.map(s => s.items.map((orig, di) => { const a = s.ans[di], d = QUIZ[s.proc][+a.desc]; const letter = LETTERS[s.descOrder.indexOf(+a.desc)]; return { di, name: QUIZ[s.proc][+a.name].name[L], desc: wrapText(measure, `${letter}. ${d.desc[L]}`, W - PAD * 2 - 170 - 300) }; }));
  const rowH = rw => Math.max(108, 30 + rw.desc.length * 32);
  let H = 420; rows.forEach(rs => { H += 70; rs.forEach(rw => H += rowH(rw)); }); H += 80;
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, W, H);
  g.fillStyle = '#4a37a6'; g.fillRect(0, 0, W, 14);
  g.textBaseline = 'top'; g.fillStyle = '#161a2c';
  g.font = `700 40px ${FD}`; g.fillText(tx('sheetTitle'), PAD, 56);
  g.font = `24px ${F}`; g.fillStyle = '#596079';
  const when = r.at.toLocaleString(app.lang === 'th' ? 'th-TH' : 'en-GB', { dateStyle: 'medium', timeStyle: 'short' });
  g.fillText(`${tx('sheetName')}: `, PAD, 140); g.fillText(`${tx('studentId')}: `, PAD, 182); g.fillText(`${tx('submittedAt')}: `, PAD, 224);
  g.fillStyle = '#161a2c'; g.font = `600 26px ${F}`;
  const lx = PAD + 190; g.fillText(`${st.first} ${st.last}`, lx, 138); g.fillText(st.id, lx, 180); g.font = `24px ${F}`; g.fillText(when, lx, 224);
  // score box
  const bx = W - PAD - 330, by = 120;
  g.strokeStyle = '#4a37a6'; g.lineWidth = 3; g.strokeRect(bx, by, 330, 170);
  g.fillStyle = '#596079'; g.font = `600 22px ${FD}`; g.fillText(tx('score'), bx + 24, by + 18);
  g.fillStyle = '#4a37a6'; g.font = `700 64px ${FD}`; const sTxt = String(r.total); g.fillText(sTxt, bx + 24, by + 48);
  const sw = g.measureText(sTxt).width; g.fillStyle = '#596079'; g.font = `500 30px ${FD}`; g.fillText(`/ ${r.max}`, bx + 34 + sw, by + 78);
  g.font = `20px ${F}`; r.perSec.forEach((p, si) => g.fillText(tx('secScore')(secTitle(si), p.got, p.max), bx + 24, by + 114 + si * 26));
  g.fillStyle = '#dde0ea'; g.fillRect(PAD, 330, W - PAD * 2, 2);
  let y = 360;
  q.secs.forEach((s, si) => {
    g.fillStyle = '#4a37a6'; g.font = `700 28px ${FD}`; g.fillText(secTitle(si), PAD, y); y += 54;
    g.fillStyle = '#596079'; g.font = `600 18px ${FD}`;
    g.fillText(tx('colImg'), PAD, y - 22); g.fillText(tx('pickName'), PAD + 170, y - 22); g.fillText(tx('pickDesc'), PAD + 470, y - 22);
    rows[si].forEach(rw => {
      const h = rowH(rw), im = imgs[s.proc][rw.di];
      g.fillStyle = '#060a13'; g.fillRect(PAD, y + 8, 128, 96);
      if (im) g.drawImage(im, PAD, y + 8, 128, 96);
      g.fillStyle = '#ffffff'; g.font = `600 15px ${F}`; g.fillText(tx('img')(rw.di + 1), PAD + 6, y + 12);
      g.fillStyle = '#161a2c'; g.font = `600 24px ${F}`; g.fillText(rw.name, PAD + 170, y + 18);
      g.font = `22px ${F}`; rw.desc.forEach((ln, k) => g.fillText(ln, PAD + 470, y + 20 + k * 32));
      y += h; g.fillStyle = '#eceef4'; g.fillRect(PAD, y - 2, W - PAD * 2, 1);
    });
    y += 16;
  });
  g.fillStyle = '#9aa1bb'; g.font = `16px ${F}`; g.fillText('Cell Division 3D Lab', PAD, H - 44);

}
async function saveSheet() {
  const msg = $('qSaveMsg'), btn = $('qSave'); if (!downloadsApi || !btn) return;
  btn.disabled = true; msg.style.color = 'var(--muted)'; msg.textContent = tx('saving');
  try {
    const blob = await buildSheet();
    const safeId = (app.student && app.student.id || 'student').replace(/[^\w\-]+/g, '_');
    await downloadsApi.save({ filename: `answer-sheet_${safeId}.jpg`, data: blob });
    msg.style.color = 'var(--ok)'; msg.textContent = tx('saved');
  } catch (e) {
    const code = e && e.code;
    if (code === 'declined') { msg.style.color = 'var(--muted)'; msg.textContent = tx('declined'); }
    else { msg.style.color = 'var(--bad)'; msg.textContent = tx('saveFail'); }
  } finally { btn.disabled = false; }
}

// ---------- labels ----------
const lblPool = [];
function updateLabels() {
  let n = 0;
  if (viewer && app.labels && app.mode !== 'quiz' && $('start').hidden) {
    for (const k of stages()[app.stage].labels) {
      const a = viewer.anchors[k]; if (!a) continue;
      const p = viewer.project(a); if (!p) continue;
      let el = lblPool[n]; if (!el) { el = document.createElement('div'); el.className = 'lbl'; $('labels').appendChild(el); lblPool.push(el); }
      el.hidden = false; el.textContent = LABELS[k][Li()]; el.style.left = p.x + 'px'; el.style.top = p.y + 'px'; n++;
    }
  }
  for (let i = n; i < lblPool.length; i++) lblPool[i].hidden = true;
}

// ---------- main loop ----------
function currentState() {
  if (app.mode === 'quiz' && app.focus && app.quiz) {
    const s = app.quiz.secs[app.focus.si];
    return PROCESSES[s.proc](QUIZ[s.proc][s.items[app.focus.di]].T);
  }
  if (app.mode === 'quiz') return PROCESSES.meiosis(12.95);
  return PROCESSES[app.proc](app.T, performance.now() / 1000);
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (app.mode !== 'quiz') {
    if (app.playing) {
      app.T += dt * app.speed / DUR;
      if (app.T >= app.stage + 1) {
        app.T = app.stage + 1; app.playing = false;
        app.hold = app.autoNext && app.stage < stages().length - 1 ? 1.4 : 0;
        updatePlayBtn();
      }
      app.dirty = true; updateScrub();
    } else if (app.hold > 0) {
      app.hold -= dt; if (app.hold <= 0) goStage(app.stage + 1, true);
    }
  }
  if (app.mode !== 'quiz' && app.proc === 'meiosis' && app.T > 14.5) app.dirty = true; // beating tail
  if (viewer) {
    if (app.dirty) { viewer.apply(currentState()); app.dirty = false; }
    viewer.render(dt);
    updateLabels();
  }
  requestAnimationFrame(frame);
}

// ---------- events ----------
$('bPrev').onclick = () => goStage(app.stage - 1, true);
$('bNext').onclick = () => goStage(app.stage + 1, true);
$('bReplay').onclick = () => goStage(app.stage, true);
$('bPlay').onclick = () => {
  if (app.playing) app.playing = false;
  else if (app.T >= app.stage + 1 - 1e-3) { app.T = app.stage; app.playing = true; }
  else app.playing = true;
  app.hold = 0; updatePlayBtn();
};
$('scrub').oninput = e => { app.T = app.stage + e.target.value / 1000; app.playing = false; app.hold = 0; app.dirty = true; $('scrubOut').textContent = Math.round(e.target.value / 10) + '%'; updatePlayBtn(); };
$('speed').onchange = e => { app.speed = +e.target.value; };
$('autoNext').onchange = e => { app.autoNext = e.target.checked; };
$('steps').onclick = e => { const b = e.target.closest('.chip'); if (b) goStage(+b.dataset.k, true); };
$('ctaBtn').onclick = () => setMode(app.proc === 'mitosis' ? 'meiosis' : 'quiz');
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => setMode(b.dataset.mode));
$('langBtn').onclick = () => { app.lang = app.lang === 'th' ? 'en' : 'th'; renderStatic(); renderStage(); if (app.mode === 'quiz') { renderQuiz(); if (app.focus) focusQuiz(app.focus.si, app.focus.di); } };
function syncLabelUI() { $('btnLabels').setAttribute('aria-pressed', app.labels); $('lblBtnTxt').textContent = app.labels ? tx('lblOn') : tx('lblOff'); $('lblToggle').checked = app.labels; }
function setLabels(v) { app.labels = v; syncLabelUI(); }
$('btnLabels').onclick = () => setLabels(!app.labels);
$('lblToggle').onchange = e => setLabels(e.target.checked);

$('quiz').addEventListener('change', e => {
  const s = e.target.closest('select[data-f]'); if (!s) return;
  const sec = app.quiz.secs[+s.dataset.si]; sec.ans[+s.dataset.di][s.dataset.f] = s.value;
  s.classList.toggle('empty', s.value === '');
  focusQuiz(+s.dataset.si, +s.dataset.di);
});
$('quiz').addEventListener('click', e => {
  const im = e.target.closest('.q-img'); if (im) { focusQuiz(+im.dataset.si, +im.dataset.di); return; }
  if (e.target.id === 'qSubmit') submitQuiz();
  if (e.target.id === 'qSave') saveSheet();
  if (e.target.id === 'qRetry') { newQuiz(); renderQuiz(); focusQuiz(0, 0); $('panel').scrollTop = 0; }
  if (e.target.id === 'qBack') setMode('mitosis');
});
document.addEventListener('keydown', e => {
  if (!$('start').hidden || app.mode === 'quiz') return;
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (e.key === 'ArrowRight') goStage(app.stage + 1, true);
  else if (e.key === 'ArrowLeft') goStage(app.stage - 1, true);
  else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); }
});
// move the 3D view to a question as soon as the student starts working on it
$('quiz').addEventListener('focusin', e => { const s = e.target.closest('select[data-si]'); if (s && app.focus && (app.focus.si !== +s.dataset.si || app.focus.di !== +s.dataset.di)) focusQuiz(+s.dataset.si, +s.dataset.di); });
$('quiz').addEventListener('pointerdown', e => { const c = e.target.closest('.q-card'); if (c && app.focus && (app.focus.si !== +c.dataset.si || app.focus.di !== +c.dataset.di)) focusQuiz(+c.dataset.si, +c.dataset.di); });
// start screen
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => { app.lang = b.dataset.lang; renderStatic(); renderStage(); });
$('startForm').addEventListener('submit', e => {
  e.preventDefault();
  const first = $('inFirst').value.trim(), lastN = $('inLast').value.trim(), id = $('inId').value.trim();
  if (!first || !lastN || !id) { $('sErr').textContent = tx('errFill'); return; }
  app.student = { first, last: lastN, id };
  $('start').hidden = true;
  if (viewer) { viewer.auto = false; viewer.resetView(); }
  renderStatic(); setMode('mitosis');
});

  new ResizeObserver(() => { viewer.resize(); app.dirty = true; }).observe($('viewer'));
  viewer.resize(); viewer.auto = true;
}
document.querySelector('.tabs button[data-mode="mitosis"]').setAttribute('aria-selected', 'true');
renderStatic(); renderStage(); updateScrub();
requestAnimationFrame(frame);
</script>
