<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ผ่ากบสามมิติ · ห้องปฏิบัติการเสมือน · v2026-10-18r18</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bench-1:#e3e9e5; --bench-2:#c9d3cd;
  --panel:rgba(250,252,251,.9); --panel-line:rgba(23,32,29,.12);
  --ink:#17201d; --muted:#56635d;
  --scrub:#0e7c7b; --scrub-ink:#ffffff; --scrub-soft:rgba(14,124,123,.14);
  --cut:#a4161a; --warn:#8a5a00;
  --chip:rgba(23,32,29,.82); --chip-ink:#fff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  font-family:'IBM Plex Sans Thai','Noto Sans Thai','Sukhumvit Set','Leelawadee UI',Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bench-1:#25302c; --bench-2:#131a18;
    --panel:rgba(30,38,35,.9); --panel-line:rgba(233,240,236,.12);
    --ink:#e8efeb; --muted:#9fb0a8;
    --scrub:#3cbfb2; --scrub-ink:#0b1a18; --scrub-soft:rgba(60,191,178,.18);
    --cut:#ff6b6b; --warn:#f2c26b;
    --chip:rgba(240,246,243,.9); --chip-ink:#14201c;
  }
}
:root[data-theme="dark"]{
  --bench-1:#25302c; --bench-2:#131a18;
  --panel:rgba(30,38,35,.9); --panel-line:rgba(233,240,236,.12);
  --ink:#e8efeb; --muted:#9fb0a8;
  --scrub:#3cbfb2; --scrub-ink:#0b1a18; --scrub-soft:rgba(60,191,178,.18);
  --cut:#ff6b6b; --warn:#f2c26b;
  --chip:rgba(240,246,243,.9); --chip-ink:#14201c;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);overflow:hidden;overscroll-behavior:none}
body{height:100%;height:100dvh;margin:0;overflow:hidden;position:fixed;inset:0;overscroll-behavior:none;-webkit-touch-callout:none;color:var(--ink);
  background:radial-gradient(120% 90% at 50% 35%,var(--bench-1),var(--bench-2));
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#c.t-scalpel{cursor:crosshair} #c.t-forceps{cursor:grab} #c.t-view{cursor:move}

button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--scrub);outline-offset:2px}

/* top: step card + side controls */
#top{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;display:flex;gap:10px;align-items:flex-start}
.card{background:var(--panel);border:1px solid var(--panel-line);border-radius:16px;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 6px 24px rgba(10,20,16,.12)}
#step{pointer-events:auto;flex:1;max-width:520px;padding:10px 14px 10px}
#step .row{display:flex;align-items:center;gap:10px;width:100%;padding:0;border:0;background:none;text-align:left;cursor:pointer}
#step .chev{margin-left:auto;flex:none;color:var(--muted);transition:transform .2s}
#step.collapsed .chev{transform:rotate(-90deg)}
#step.collapsed #stepText{display:none}
#stepNum{font-size:13px;font-weight:600;color:var(--scrub);white-space:nowrap}
#stepTitle{font-size:17px;font-weight:700;line-height:1.3}
#stepText{margin:4px 0 8px;font-size:14px;line-height:1.55;color:var(--muted)}
#stepText b{color:var(--ink);font-weight:600}
.progrow{display:flex;align-items:center;gap:10px;margin-top:6px}
#chkBtn{display:none;border:1px solid var(--panel-line);background:transparent;border-radius:999px;font-size:12px;padding:2px 9px;cursor:pointer;color:var(--ink);white-space:nowrap}
#step.explore #chkBtn{display:inline-block}
#checklist{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;max-height:34vh;overflow:auto}
#checklist[hidden]{display:none}
#checklist button{font-size:12px;border-radius:999px;padding:3px 9px;border:1px dashed var(--panel-line);background:transparent;color:var(--muted);cursor:pointer}
#checklist button.done{border-style:solid;background:var(--scrub-soft);color:var(--ink)}
#checklist button.done::before{content:"✓ ";color:var(--scrub);font-weight:700}
.prog{flex:1;height:5px;border-radius:3px;background:var(--scrub-soft);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--scrub);border-radius:3px;transition:width .25s}
#progLabel{font-size:12px;color:var(--muted);white-space:nowrap}

#side{pointer-events:auto;margin-left:auto;display:flex;flex-direction:column;gap:8px}
.sbtn{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;cursor:pointer;
  background:var(--panel);border:1px solid var(--panel-line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.sbtn svg{width:22px;height:22px}
.sbtn.on{background:var(--scrub);color:var(--scrub-ink);border-color:transparent}
.sbtn .txt{font-size:18px;font-weight:700;line-height:1}

/* layer panel */
#layerPanel{position:fixed;z-index:7;right:72px;top:calc(env(safe-area-inset-top,0px) + 10px);width:min(290px,calc(100vw - 92px));
  padding:10px 6px 6px;display:none}
#layerPanel.show{display:block}
#layerPanel h4{margin:0 10px 4px;font-size:13px;color:var(--muted);font-weight:600}
.lrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer}
.lrow:hover{background:var(--scrub-soft)}
.lrow .dot{width:12px;height:12px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.15)}
.lrow .txt{flex:1;min-width:0;line-height:1.3}
.lrow .txt b{display:block;font-size:14px;font-weight:600}
.lrow .txt small{font-size:11.5px;color:var(--muted)}
.lrow input{appearance:none;-webkit-appearance:none;width:38px;height:22px;border-radius:11px;background:var(--panel-line);position:relative;flex:none;cursor:pointer;margin:0;transition:background .15s}
.lrow input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.lrow input:checked{background:var(--scrub)}
.lrow input:checked::after{transform:translateX(16px)}
.lrow input:focus-visible{outline:3px solid var(--scrub);outline-offset:2px}
.lsep{height:1px;background:var(--panel-line);margin:4px 10px}
@media (max-width:600px){#layerPanel{right:56px;top:calc(env(safe-area-inset-top,0px) + 8px)}}

/* microscope */
#hots{position:fixed;inset:0;pointer-events:none;z-index:4;display:none}
.hot{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;display:flex;align-items:center;gap:6px;
  border:0;background:none;padding:0;cursor:pointer}
.hot i{width:22px;height:22px;border-radius:50%;background:var(--scrub);border:3px solid #fff;box-shadow:0 0 0 2px var(--scrub),0 2px 6px rgba(0,0,0,.35);position:relative;flex:none}
.hot i::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid var(--scrub);animation:hotp 1.8s ease-out infinite}
@keyframes hotp{from{transform:scale(.6);opacity:.9}to{transform:scale(1.3);opacity:0}}
@media (prefers-reduced-motion:reduce){.hot i::after{animation:none;opacity:.5}}
.hot.left{flex-direction:row-reverse;transform:translate(calc(-100% + 14px),-50%)}
.hot span{font-size:12px;font-weight:600;padding:2px 7px;border-radius:7px;background:var(--chip);color:var(--chip-ink);white-space:nowrap}
#micro{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(8,12,10,.55);
  padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
#micro.show{display:flex}
#micro .mbox{position:relative;width:min(460px,100%);max-height:100%;overflow:auto;padding:14px 16px 14px}
#micro h3{margin:0 40px 0 0;font-size:18px} #micro .en{font-style:italic;color:var(--muted);font-size:13px;margin-left:6px;font-weight:500}
#micro .where{font-size:12px;color:var(--muted);margin:2px 0 10px}
#micro .close{position:absolute;top:8px;right:8px;width:36px;height:36px;border:0;background:transparent;cursor:pointer;color:var(--muted);border-radius:10px}
.mscope{position:relative;width:min(100%,340px);aspect-ratio:1;margin:0 auto;border-radius:50%;overflow:hidden;background:#111;
  box-shadow:0 0 0 8px #1b1f1d,0 0 0 9px #444,inset 0 0 40px rgba(0,0,0,.65);touch-action:none;cursor:grab}
.mscope::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 50px 12px rgba(0,0,0,.55);pointer-events:none}
.lens{position:absolute;inset:0}
.lens .slide{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s ease;transform-origin:50% 50%}
.mags{display:flex;justify-content:center;gap:8px;margin:14px 0 8px}
.mags button{min-width:56px;height:34px;border-radius:17px;border:1px solid var(--panel-line);background:transparent;cursor:pointer;font-weight:600}
.mags button.on{background:var(--scrub);color:var(--scrub-ink);border-color:transparent}
#microDesc{font-size:14px;line-height:1.6;margin:6px 0 8px}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.keys span{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--scrub-soft)}
#microSrc{font-size:11.5px;color:var(--muted)}
@media (max-width:600px){#micro .mbox{padding:12px} .mscope{width:min(100%,300px)} #microDesc{font-size:13px}}

/* bleeding */
body.bleed::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:3;box-shadow:inset 0 0 140px 30px rgba(170,0,12,.6);animation:bleedp .7s ease-in-out infinite alternate}
@keyframes bleedp{from{opacity:.45}to{opacity:1}}
@media (prefers-reduced-motion:reduce){body.bleed::after{animation:none}}

/* toast */
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 76px);transform:translate(-50%,-6px);
  z-index:7;max-width:min(88vw,460px);padding:10px 16px;border-radius:12px;font-size:14px;line-height:1.5;
  background:var(--ink);color:var(--bench-1);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* info sheet */
#info{position:fixed;z-index:6;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 104px);
  max-width:520px;margin:0 auto;padding:14px 16px 14px;display:none}
#info.show{display:block}
#info h3{margin:0;font-size:19px;line-height:1.3;font-weight:700}
#info .en{font-style:italic;color:var(--muted);font-size:14px;margin-left:6px;font-weight:500}
#info p{margin:4px 0 6px;font-size:14px;line-height:1.55}
#info.clamp p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#info .more{display:none;font-size:12px;color:var(--muted);margin-top:2px}
#info.clamp .more{display:block}
#info .move{font-size:13px;color:var(--scrub);font-weight:600;line-height:1.5}
#info.mini{padding:7px 44px 7px 12px;width:auto;right:auto;max-width:min(360px,calc(100% - 16px));cursor:pointer}
#info.mini p,#info.mini .move,#info.mini .more{display:none}
#info.mini h3{font-size:15px}
#info.mini .close{top:2px}
#info .close{position:absolute;top:8px;right:8px;width:36px;height:36px;border:0;background:transparent;cursor:pointer;color:var(--muted);border-radius:10px}
@media (min-width:900px) and (orientation:landscape){
  #info{left:12px;right:auto;width:380px;margin:0;bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
}

/* tool dock: an instrument tray */
#dock{position:fixed;z-index:6;left:50%;bottom:0;transform:translate3d(-50%,0,0);will-change:transform;-webkit-backface-visibility:hidden;
  padding:0 0 calc(env(safe-area-inset-bottom,0px) + 12px);pointer-events:none}
#dock .tray{pointer-events:auto;display:flex;gap:6px;padding:6px}
.tool{width:84px;height:74px;border:0;border-radius:12px;background:transparent;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative}
.tool svg{width:40px;height:30px}
.tool span{font-size:13px;font-weight:600}
.tool.on{background:var(--scrub);color:var(--scrub-ink)}
.tool.suggest:not(.on)::after{content:"";position:absolute;inset:3px;border-radius:10px;border:2px solid var(--scrub);
  animation:ring 1.4s ease-in-out infinite}
@keyframes ring{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.tool.suggest:not(.on)::after{animation:none;opacity:.8}}

/* labels */
#labels{position:fixed;inset:0;pointer-events:none;z-index:4}
.lbl{position:absolute;transform:translate(-50%,-130%);padding:3px 8px;border-radius:8px;font-size:12px;font-weight:600;
  background:var(--chip);color:var(--chip-ink);white-space:nowrap}
.lbl::after{content:"";position:absolute;left:50%;bottom:-4px;width:8px;height:8px;margin-left:-4px;background:var(--chip);transform:rotate(45deg)}

#fail{position:fixed;inset:0;display:none;place-items:center;padding:24px;text-align:center;font-size:16px;line-height:1.6}

@media (max-width:600px){
  #top{padding:calc(env(safe-area-inset-top,0px) + 8px) 8px 0;gap:8px}
  #step{padding:8px 12px;border-radius:14px}
  #stepNum{font-size:12px} #stepTitle{font-size:15px} #stepText{font-size:13px;line-height:1.5}
  #progLabel{font-size:11px}
  #side{gap:6px}
  .sbtn{width:40px;height:40px;border-radius:12px} .sbtn svg{width:19px;height:19px} .sbtn .txt{font-size:16px}
  #dock{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 8px)}
  #dock .tray{padding:4px;gap:4px}
  .tool{width:62px;height:54px;gap:2px;border-radius:10px} .tool svg{width:28px;height:21px} .tool span{font-size:11px}
  #info{left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);padding:9px 40px 9px 12px;border-radius:14px}
  #info h3{font-size:16px} #info .en{font-size:12px} #info p{font-size:13px} #info .move{font-size:12px}
  #info .close{top:4px;right:4px}
}
</style>
</head>
<body>
<canvas id="c" class="t-view" tabindex="0" aria-label="โมเดลกบสามมิติสำหรับฝึกผ่า"></canvas>
<div id="labels"></div>

<div id="top">
  <section id="step" class="card" aria-live="polite">
    <button class="row" id="stepHead" aria-expanded="true" aria-controls="stepText">
      <span id="stepNum">1/3</span><span id="stepTitle"></span>
      <svg class="chev" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <p id="stepText"></p>
    <div class="progrow"><div class="prog"><i id="progBar"></i></div><span id="progLabel"></span><button id="chkBtn" aria-expanded="false" aria-controls="checklist">รายการ ▾</button></div>
    <div id="checklist" hidden></div>
  </section>
  <div id="side">
    <button class="sbtn" id="btnView" aria-label="จัดมุมมองใหม่" title="จัดมุมมองใหม่">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/><circle cx="12" cy="12" r="2.5"/></svg>
    </button>
    <button class="sbtn" id="btnLabels" aria-label="แสดงป้ายชื่ออวัยวะ" title="ป้ายชื่ออวัยวะ" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 12V4h8l10 10-8 8L3 12z"/><circle cx="7.5" cy="8" r="1.5"/></svg>
    </button>
    <button class="sbtn" id="btnLayers" aria-label="เลือกระบบที่แสดง" title="ระบบที่แสดง" aria-expanded="false" aria-controls="layerPanel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg>
    </button>
    <button class="sbtn" id="btnSex" aria-label="สลับเพศของกบ" title="สลับเพศ: ตัวผู้"><span class="txt" id="sexTxt">♂</span></button>
    <button class="sbtn" id="btnRestart" aria-label="เริ่มผ่าใหม่" title="เริ่มผ่าใหม่">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4"/></svg>
    </button>
  </div>
</div>

<section id="layerPanel" class="card" aria-label="ระบบที่แสดง"><h4>ระบบที่แสดง</h4><div id="layerList"></div><p style="margin:8px 0 0;font-size:11px;opacity:.55">เวอร์ชัน 2026-10-18 r18 · เลเยอร์อวัยวะภายใน</p></section>
<div id="toast" role="status"></div>

<section id="info" class="card" aria-live="polite">
  <button class="close" id="infoClose" aria-label="ปิด">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <h3><span id="infoTh"></span><span class="en" id="infoEn"></span></h3>
  <p id="infoDesc"></p>
  <div class="move" id="infoMove"></div>
  <div class="more">แตะเพื่ออ่านต่อ</div>
</section>

<nav id="dock" aria-label="เครื่องมือ">
  <div class="tray card">
    <button class="tool on" data-tool="view" aria-label="หมุนมุมมอง">
      <svg viewBox="0 0 40 30" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="20" cy="15" rx="15" ry="7"/><path d="M31 6l4 3-4 3"/><circle cx="20" cy="15" r="2.4"/></svg>
      <span>มุมมอง</span>
    </button>
    <button class="tool" data-tool="scalpel" aria-label="มีดผ่าตัด">
      <svg viewBox="0 0 40 30" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 25L20 13"/><path d="M20 13c4-3 9-6 15-8-2 6-7 10-12 12z" fill="currentColor" fill-opacity=".25"/></svg>
      <span>มีดผ่าตัด</span>
    </button>
    <button class="tool" data-tool="scissors" aria-label="กรรไกร">
      <svg viewBox="0 0 40 30" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="4.5"/><circle cx="8" cy="22" r="4.5"/><path d="M12 10l24 11M12 20l24-11"/></svg>
      <span>กรรไกร</span>
    </button>
    <button class="tool" data-tool="forceps" aria-label="ปากคีบ">
      <svg viewBox="0 0 40 30" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9c10 1 22 4 34 5M3 21c10-1 22-4 34-5"/><path d="M3 9v12"/></svg>
      <span>ปากคีบ</span>
    </button>
    <button class="tool" data-tool="micro" aria-label="กล้องจุลทรรศน์">
      <svg viewBox="0 0 40 30" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l6 3-6 12-6-3z"/><path d="M14 21a9 9 0 0 0 14-9"/><path d="M10 27h22M20 18v3"/></svg>
      <span>จุลทรรศน์</span>
    </button>
  </div>
</nav>

<div id="hots"></div>
<section id="micro" role="dialog" aria-modal="true" aria-labelledby="microTitle">
  <div class="mbox card">
    <button class="close" id="microClose" aria-label="ปิดกล้องจุลทรรศน์"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <h3><span id="microTitle"></span><span class="en" id="microEn"></span></h3>
    <div class="where" id="microWhere"></div>
    <div class="mscope" id="microScope"><div class="lens" id="microLens"></div></div>
    <div class="mags" id="microMags" aria-label="กำลังขยาย"></div>
    <p id="microDesc"></p>
    <div class="keys" id="microKeys"></div>
    <small id="microSrc"></small>

    for(let i=0;i<=M2;i++){const q=Q[i%M2];const px=c.x+(q.x-c.x)*rho,pz=c.z+(q.z-c.z)*rho;pos.push(px,yc+h,pz);uv.push(px*.6+.5,pz*.6+.5);}}
  for(let s=0;s<S;s++)for(let i=0;i<M2;i++){const A=s*(M2+1)+i,Bv=A+1,C=A+M2+1,D=C+1;idx.push(A,Bv,C,Bv,D,C);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(idx);g.computeVertexNormals();
  const m=new THREE.Mesh(g,mat);m.castShadow=true;m.receiveShadow=true;return m;
}

function mergeIdx(geos){let n=0;geos.forEach(g=>n+=g.attributes.position.count);const pos=new Float32Array(n*3),idx=[];let o=0;
  geos.forEach(g=>{pos.set(g.attributes.position.array,o*3);const I=g.index?g.index.array:[...Array(g.attributes.position.count).keys()];for(const i of I)idx.push(i+o);o+=g.attributes.position.count;});
  const m=new THREE.BufferGeometry();m.setAttribute('position',new THREE.BufferAttribute(pos,3));m.setIndex(idx);m.computeVertexNormals();return m;}
/* pillow whose upper half follows one outline and lower half another (ventral / dorsal views) */
function pillow2(topPx,botPx,yc,top,bot,mat,hfn){
  const Tw=topPx.map(p=>W(p[0],p[1],0)),Bw=botPx.map(p=>W(p[0],p[1],0)),c=new V3();Tw.forEach(q=>c.add(q));c.multiplyScalar(1/Tw.length);
  const ray=(poly,th)=>{const dx=Math.cos(th),dz=Math.sin(th);let best=0;
    for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length],ex=b.x-a.x,ez=b.z-a.z,den=dx*ez-dz*ex;if(Math.abs(den)<1e-9)continue;
      const ax=a.x-c.x,az=a.z-c.z,t=(ax*ez-az*ex)/den,u=(ax*dz-az*dx)/den;if(u>=0&&u<=1&&t>best)best=t;}return best;};
  const M2=120,S=16,rT=[],rB=[];
  for(let i=0;i<M2;i++){const th=i/M2*2*PI;rT.push(ray(Tw,th));rB.push(ray(Bw,th)||rT[i]);}
  const sm=a=>a.map((v,i)=>(a[(i+M2-1)%M2]+2*v+a[(i+1)%M2])/4);const RT=sm(sm(rT)),RB=sm(sm(rB));
  const pos=[],idx=[];
  for(let s=0;s<=S;s++){const ph=s/S*PI,rho=Math.pow(Math.sin(ph),.75),cy=Math.cos(ph),h=cy>0?cy*top:cy*bot,b=clamp((s/S-.3)/.4,0,1),bl=b*b*(3-2*b);
    for(let i=0;i<=M2;i++){const k=i%M2,th=k/M2*2*PI,r=(RT[k]*(1-bl)+RB[k]*bl)*rho,z=c.z+Math.sin(th)*r;let hh=h;if(hfn){const tb=hfn(z);hh=cy>0?cy*tb[0]:cy*tb[1];}pos.push(c.x+Math.cos(th)*r,yc+hh,z);}}
  for(let s=0;s<S;s++)for(let i=0;i<M2;i++){const A=s*(M2+1)+i,Bv=A+1,C=A+M2+1,D=C+1;idx.push(A,Bv,C,Bv,D,C);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();
  const m=new THREE.Mesh(g,mat);m.castShadow=true;m.receiveShadow=true;return m;
}

/* ================= flaps (skin & muscle) ================= */
function makeFlap(a0,a1,hingeA,sign,k,outerMat,innerMat,flatY,parent,t0,t1){
  t0=t0===undefined?T_A:t0;t1=t1===undefined?T_M:t1;
  const nt=40,na=Math.max(8,Math.round(Math.abs(a1-a0)/.055));
  const geo=bodyPatch(t0,t1,a0,a1,k,nt,na);
  const base=geo.attributes.position.array.slice();
  const hinge=new Float32Array((nt+1)*(na+1)*2);
  for(let i=0;i<=nt;i++){const t=t0+(t1-t0)*i/nt;const h=bodyPoint(t,hingeA,k);
    for(let j=0;j<=na;j++){const v=i*(na+1)+j;hinge[v*2]=h.x;hinge[v*2+1]=h.y;}}
  const outer=shell(parent,geo,outerMat,null);
  const inner=new THREE.Mesh(geo,innerMat);inner.receiveShadow=true;parent.add(inner);
  return {geo,base,hinge,sign,flatY,outer,inner,angle:0,hingeA,k,angFn:()=>0};
}
function setFlapAngle(f,ang){setFlapAngles(f,()=>ang);}
function setFlapAngles(f,fn){
  f.angFn=fn;const p=f.geo.attributes.position.array,b=f.base,h=f.hinge,n=b.length/3;
  let lastZ=NaN,c=1,s=0;
  for(let v=0;v<n;v++){
    if(b[v*3+2]!==lastZ){lastZ=b[v*3+2];const a=fn(lastZ/BL)*f.sign;c=Math.cos(a);s=Math.sin(a);}
    const hx=h[v*2],hy=h[v*2+1],dx=b[v*3]-hx,dy=b[v*3+1]-hy;
    let x=hx+dx*c-dy*s,y=hy+dx*s+dy*c;
    if(y<f.flatY){x+=-f.sign*(f.flatY-y);y=f.flatY;}
    p[v*3]=x;p[v*3+1]=y;p[v*3+2]=b[v*3+2];
  }
  if(f.jaw&&state.jawMx){const tmp=Float32Array.from(p);jawXform(p,tmp);}
  f.geo.attributes.position.needsUpdate=true;f.geo.computeVertexNormals();f.geo.computeBoundingSphere();
}

/* ================= cut lines ================= */
function makeLine(pts,parent){
  const L={samples:pts,cut:pts.map(()=>false),segs:[],done:false};
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i],b=pts[i+1],d=b.clone().sub(a),len=d.length();
    const m=new THREE.Mesh(cylGeo,M.dash);
    m.position.copy(a).addScaledVector(d,.5);m.quaternion.setFromUnitVectors(UP,d.normalize());
    m.userData.len=len;parent.add(m);L.segs.push(m);
  }
  refreshLine(L);return L;
}
function refreshLine(L){
  if(L.hidden){L.segs.forEach(m=>m.visible=false);return;}
  L.segs.forEach((m,i)=>{
    const cut=L.cut[i]&&L.cut[i+1];
    if(cut){m.material=L.cutMat||M.incision;m.visible=true;m.scale.set(.034,m.userData.len*1.02,.034);}
    else{m.material=L.dashMat||M.dash;m.visible=i%2===0;m.scale.set(.034,m.userData.len*.9,.034);}
  });
}
function longLine(a,k,n,t0,t1){t0=t0===undefined?T_A:t0;t1=t1===undefined?T_M:t1;const out=[];for(let i=0;i<n;i++)out.push(bodyPoint(t0+(t1-t0)*i/(n-1),a,k));return out;}
function crossLine(t,k,n){const out=[];const a0=A_L+.06,a1=A_R-.06;for(let i=0;i<n;i++)out.push(bodyPoint(t,a0+(a1-a0)*i/(n-1),k));return out;}

        d=t.distanceTo(th.a);if(d>reach)t.sub(th.a).multiplyScalar(reach/d).add(th.a);}

  state.jawMeshes=[shell(root,jCap,M.ventral,oIn),shell(root,jR,M.ventral,oIn),shell(root,jL,M.ventral,oIn)];
  shell(root,bodyPatch(T_A,.42,0,A_L,1,40,6),M.ventral,M.cavity);

  root.add(loft(ml,()=>.02,M.dark,{segs:90,rs:6}));
  [-1,1].forEach(sx=>{
    const ep=bodyPoint(.66,sx>0?-.45:PI+.45,1.22);ell(M.eye,ep,new V3(.16,.15,.19),root);
    const tp=bodyPoint(.47,sx>0?-.18:PI+.18,1.004),ty=new THREE.Mesh(new THREE.CircleGeometry(.16,24),M.tympanum);

  });

    cap(legC[legC.length-1],legR[legR.length-1]);cap(armC[armC.length-1],armR[armR.length-1]);
    const near=(C,q)=>{let b=C[0],bd=1e9;C.forEach(c=>{const d=Math.hypot(c.x-q.x,c.z-q.z);if(d<bd){bd=d;b=c;}});return b.y;};

    ell(M.limb,wr.clone().setY(Math.max(.1,wr.y*.7)),new V3(.15,.09,.15),root);
    fingers.forEach(t=>{const mid=wr.clone().lerp(t,.5).setY(.1);root.add(loft([wr.clone().setY(Math.max(.1,wr.y*.7)),mid,t],u=>.05*(1-.3*u),M.limb,{segs:20,rs:12,sy:.8}));
      ell(M.limb,t,new V3(.055,.04,.055),root);});
    {const tz=clamp(sh.z/BL,-.97,.97),wx=prof(tz).w*.93*Math.sign(sh.x),sc=new V3(wx,.3,sh.z-.02),dir=el.clone().sub(sh).setY(0).normalize();
      const blob=ell(M.limb,sc,new V3(.34,.3,.36),root);blob.rotation.y=Math.atan2(dir.x,dir.z);

    {const hc2=hip.clone().lerp(kn,.22);hc2.y=.3;const dir=kn.clone().sub(hip).setY(0).normalize();
      const hb=ell(M.limb,hc2,new V3(.42,.32,.42),root);hb.rotation.y=Math.atan2(dir.x,dir.z);}

  });

}

function doCut(q,prev){
  const C=curCut();if(!C)return;
  const pts=[];
  if(prev){const d=prev.distanceTo(q);if(d<.9){const n=Math.max(1,Math.ceil(d/.04));for(let i=1;i<=n;i++)pts.push(prev.clone().lerp(q,i/n));}else pts.push(q);}

    if(C.f.key==='musV'&&veinHit(pt)){triggerBleed(pt);return;}
    let best=1e9;

      if(sp){const ss=toScreen(s);if(Math.hypot(ss.x-sp.x,ss.y-sp.y)<28)d=Math.min(d,CUT_TOL*.5);}   /* side of the head: judge on screen */

  if(changed){C.lines.forEach(l=>{refreshLine(l);l.done=l.cut.filter(Boolean).length/l.cut.length>=.9;});
    try{navigator.vibrate&&navigator.vibrate(4);}catch(_){}
    updateHUD();
    if(C.lines.every(l=>l.done))finishCut(C);}
}
const SLIT_A=.7,SLIT_B=.35;
const slitShape=t=>Math.pow(Math.max(0,Math.sin(PI*clamp((t-T_A)/(T_M-T_A),0,1))),.8);
function finishCut(C){
  C.lines.forEach(l=>{l.cut.fill(true);refreshLine(l);});
  endAction();
  if(C.f.key==='mouth'){state.mouthCut=true;state.cutTarget=null;C.L.hit.visible=false;goView('mouth');
    toast('ตัดมุมปากทั้งสองข้างแล้ว ใช้ปากคีบคีบที่คางแล้วลากไปทางอกเพื่ออ้าปาก');updateHUD();return;}
  const t0=performance.now()+350,[fA,fB]=state.layers[1].flaps,full=state.layers[1].openAngle;
  const sA=t=>SLIT_A*slitShape(t),sB=t=>SLIT_B*slitShape(t);
  if(C.f.key==='skin')state.opening={t0,dur:1500,flaps:C.L.flaps.map(f=>({f,from:()=>0,to:()=>C.L.openAngle})),done:()=>{
    C.L.lineGroup.visible=false;C.L.hit.visible=false;state.layers[1].lineGroup.visible=true;
    toast('ผ่าผิวหนังเรียบร้อย ต่อไปตัดกล้ามเนื้อแนวดิ่งตามเส้นประ ข้างเส้นเลือดสีม่วง');}};
  else if(C.f.key==='musV')state.opening={t0,dur:1000,flaps:[{f:fA,from:()=>0,to:sA},{f:fB,from:()=>0,to:sB}],done:()=>{
    C.lines[0].hidden=true;refreshLine(C.lines[0]);goView('cavity');
    toast('เห็นเส้นเลือดแล้ว เลือกปากคีบ แล้วลากไปตามเส้นเลือดเพื่อเลาะออกจากกล้ามเนื้อ');}};
  else if(C.f.key==='chest'){const ch=state.layers[2];state.opening={t0,dur:1600,noStep:true,
    flaps:[...ch.flaps.map(f=>({f,from:()=>0,to:()=>ch.openAngle})),...ch.mflaps.map(f=>({f,from:()=>0,to:()=>3.32}))],done:()=>{
    ch.lineGroup.visible=false;ch.hit.visible=false;state.chestOpen=true;goView('chest');
    toast('เปิดอกแล้ว กระดูกอกถูกตัดแยกไปกับผนังอก ศึกษาหัวใจได้เลย');}};}
  else if(C.f.key==='musT')state.opening={t0,dur:1500,flaps:[{f:fA,from:sA,to:()=>full},{f:fB,from:sB,to:()=>full}],done:()=>{
    C.L.lineGroup.visible=false;C.L.hit.visible=false;goView('cavity');
    toast('เปิดช่องท้องแล้ว เลือกปากคีบเพื่อคีบอวัยวะออกมาศึกษา');}};
  try{navigator.vibrate&&navigator.vibrate(20);}catch(_){}
}
function updateOpening(now){
  const o=state.opening;if(!o)return;const u=clamp((now-o.t0)/o.dur,0,1);if(u<=0)return;const e=ease(u);
  o.flaps.forEach(q=>setFlapAngles(q.f,t=>q.from(t)*(1-e)+q.to(t)*e));
  if(state.sternum)updateSternum();
  if(u>=1){state.opening=null;if(!o.noStep)state.step++;o.done();updateVein(true);updateHUD();}
}

function microAnchor(m){
  const A=state.anch||{},ch=state.chain,L=state.limbs||[];
  switch(m.id){
    case 'skin':return {p:bodyPoint(-.15,PI*.93,1.01),vis:true};
    case 'skeletal':return L[1]?{p:L[1].leg[1].clone().setY(.95),vis:true}:null;
    case 'nerve':return L[0]?{p:L[0].leg[1].clone().setY(.95),vis:true}:null;
    case 'bone':return L[0]?{p:L[0].leg[4].clone().setY(.72),vis:true}:null;

  if(state.step<EXPLORE&&!state.opening){M.dash.color.lerpColors(DASH_A,DASH_B,.5+.5*Math.sin(now/260));}
  const ch=state.chain;if(ch&&ch.grab>=0&&action&&action.type==='tube')solveChain(ch,null);
  if(state.jawPivot){const q=state.jawPivot.quaternion,jv=q.x*1.7+q.w*.3;if(Math.abs(jv-(state.lastJv||0))>1e-6){state.lastJv=jv;updateJawDeform();}}
  let pv=0;Object.values(state.attachSrc||{}).forEach(l=>l.forEach(o=>{const q=o.pivot.quaternion;pv+=q.x*1.3+q.y*2.1+q.z*3.7+q.w*.7;}));
  const pivMoved=Math.abs(pv-(state.lastPv||0))>1e-6;state.lastPv=pv;
  if(pivMoved)updateHeartDeform();
  if(ch&&(ch.dirty||pivMoved)){if(ch.dirty){updateTube(ch);updateFollow();}scene.updateMatrixWorld();(state.gutVessels||[]).forEach(n=>updateGutVessel(n));ch.dirty=false;}
  updateLabels();updateHotspots();
  renderer.render(scene,camera);
}

window.addEventListener('resize',()=>{resize();if(!tween)cam.r=clamp(cam.r,3,26);});
/* iPad / iOS: the first layout can be computed before the browser chrome settles, leaving the
   tool tray unpainted or below the visible area until the app is switched. Re-measure and repaint. */
function relayout(){resize();const d=$('dock');d.style.display='none';void d.offsetHeight;d.style.display='';}
if(window.visualViewport)visualViewport.addEventListener('resize',relayout);
window.addEventListener('orientationchange',()=>setTimeout(relayout,250));
window.addEventListener('pageshow',()=>setTimeout(relayout,60));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(relayout,60);});
[120,500,1200,2500].forEach(t=>setTimeout(relayout,t));
resize();build();goView('full',true);requestAnimationFrame(frame);
setTimeout(()=>toast('เริ่มจากเลือกมีดผ่าตัดในถาดเครื่องมือด้านล่าง'),700);
})();
