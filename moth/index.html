<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:system-ui,sans-serif;background:#111;color:#eee;}
#app{width:100%;display:flex;flex-direction:column;}
#setup-screen{padding:1.5rem 1rem;display:flex;flex-direction:column;gap:1.25rem;}
.setup-title{font-size:20px;font-weight:500;}
.setup-sub{font-size:13px;color:#aaa;margin-top:3px;}
.bg-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.bg-card{border:2px solid #333;border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color 0.15s;}
.bg-card.selected{border-color:#378ADD;}
.bg-preview{width:100%;height:90px;object-fit:cover;display:block;}
.bg-label{padding:7px 10px;font-size:13px;font-weight:500;text-align:center;background:#1a1a1a;}
.info-box{background:#1a1a1a;border-radius:10px;padding:11px 14px;font-size:13px;color:#aaa;line-height:1.65;}
.start-btn{width:100%;padding:14px;background:#378ADD;color:white;border:none;border-radius:10px;font-size:16px;font-weight:500;cursor:pointer;}
.start-btn:disabled{background:#2a2a2a;color:#555;cursor:default;}
#game-screen{display:none;flex-direction:column;height:100vh;}
#hud{display:flex;justify-content:space-around;align-items:center;padding:9px 10px;background:rgba(0,0,0,0.72);z-index:10;flex-shrink:0;}
.hud-item{text-align:center;}
.hud-lbl{font-size:10px;color:rgba(255,255,255,0.55);text-transform:uppercase;letter-spacing:0.5px;}
.hud-val{font-size:17px;font-weight:500;color:white;}
#timer-val{color:#facc15;}
#canvas-wrap{position:relative;flex:1;overflow:hidden;}
#gameCanvas{display:block;width:100%;height:100%;}
#result-screen{display:none;flex-direction:column;padding:1.25rem 1rem;gap:1rem;background:#111;min-height:100vh;}
.res-title{font-size:18px;font-weight:500;}
.res-card{background:#1a1a1a;border-radius:10px;padding:12px 16px;}
.res-lbl{font-size:12px;color:#888;margin-bottom:8px;}
.next-btn{width:100%;padding:13px;background:#378ADD;color:white;border:none;border-radius:10px;font-size:15px;font-weight:500;cursor:pointer;}
.restart-btn{width:calc(100% - 2rem);padding:13px;background:#1a1a1a;color:#eee;border:0.5px solid #333;border-radius:10px;font-size:15px;cursor:pointer;position:fixed;bottom:1rem;left:1rem;right:1rem;}
.sum-table{width:100%;border-collapse:collapse;font-size:13px;}
.sum-table th{text-align:left;padding:6px 8px;color:#888;font-weight:500;border-bottom:0.5px solid #333;}
.sum-table td{padding:7px 8px;color:#eee;border-bottom:0.5px solid #222;}
</style>
</head>
<body>
<div id="app">

<div id="setup-screen">
  <div>
    <div class="setup-title">Industrial Melanism 🌲</div>
    <div class="setup-sub">Select environment before starting</div>
  </div>
  <div class="bg-options">
    <div class="bg-card" id="card-light">
      <img class="bg-preview" id="prev-light" src="" alt="Clean bark">
      <div class="bg-label">Clean bark</div>
    </div>
    <div class="bg-card" id="card-dark">
      <img class="bg-preview" id="prev-dark" src="" alt="Soot-covered bark">
      <div class="bg-label">Soot-covered bark</div>
    </div>
  </div>
  <div class="info-box">
    You are a <strong style="color:#eee">bird</strong> hunting moths.<br>
    Tap a moth to catch it. You have <strong style="color:#eee">10 seconds</strong> per round — <strong style="color:#eee">5 rounds</strong> total.
  </div>
  <button class="start-btn" id="startBtn" disabled>Select an environment first</button>
</div>

<div id="game-screen">
  <div id="hud">
    <div class="hud-item"><div class="hud-lbl">Round</div><div class="hud-val" id="hud-round">1/5</div></div>
    <div class="hud-item"><div class="hud-lbl">Time</div><div class="hud-val" id="timer-val">10</div></div>
    <div class="hud-item"><div class="hud-lbl">Light left</div><div class="hud-val" id="hud-w">20</div></div>
    <div class="hud-item"><div class="hud-lbl">Dark left</div><div class="hud-val" id="hud-b">20</div></div>
    <div class="hud-item"><div class="hud-lbl">Birds</div><div class="hud-val" id="hud-birds">0/3</div></div>
  </div>
  <div id="canvas-wrap">
    <canvas id="gameCanvas"></canvas>
  </div>
</div>

<div id="result-screen">
  <div class="res-title" id="res-title">Round 1 complete</div>
  <div class="res-card" id="res-card"></div>
  <div id="sum-section" style="display:none;">
    <div style="font-size:14px;font-weight:500;margin-bottom:8px;">Summary</div>
    <table class="sum-table">
      <thead>
<tr>
  <th>Round</th>

  <th>
    <img src="https://api.iconify.design/mdi/butterfly.svg?color=white" width="16">
    caught
  </th>

  <th>
    <img src="https://api.iconify.design/mdi/butterfly.svg?color=white" width="16">
    left
  </th>

  <th>
    <img src="https://api.iconify.design/mdi/butterfly.svg?color=black" width="16">
    caught
  </th>

  <th>
    <img src="https://api.iconify.design/mdi/butterfly.svg?color=black" width="16">
    left
  </th>

</tr>
</thead>
      <tbody id="sum-body"></tbody>
    </table>
  </div>
  <button class="next-btn" id="nextBtn">Next Round</button>
  <button class="restart-btn" id="restartBtn" style="display:none;">Restart</button>
</div>
</div>

function selectBg(t){
  selBg=t;
  document.getElementById('card-light').classList.toggle('selected',t==='light');
  document.getElementById('card-dark').classList.toggle('selected',t==='dark');
  const b=document.getElementById('startBtn');
  b.disabled=false; b.textContent='Start Experiment';
}

function drawMoth(c2,b){
  const img=b.color==='white'?imgWhite:imgBlack;
  if(!img.complete||!img.naturalWidth)return;
  const s=b.size, dark=selBg==='dark', isW=b.color==='white';

  // interpolate position if moving
  let rx=b.x, ry=b.y;
  if(b.moving){
    const t=Math.min(1,(now()-b.moveStart)/MOVE_DUR);
    const ease=t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
    rx=b.ox+(b.tx-b.ox)*ease;
    ry=b.oy+(b.ty-b.oy)*ease;
    if(t>=1){b.x=b.tx;b.y=b.ty;b.moving=false;}
  }

  const alpha=isW?(dark?0.42:0.88):(dark?0.87:0.80);
  c2.save();
  c2.translate(rx,ry);
  c2.rotate(b.angle);
  c2.globalAlpha=alpha;
  c2.drawImage(img,-s,-s,s*2,s*2);
  c2.globalAlpha=1;
  c2.restore();

  // update stored pos for hit test
  b.rx=rx; b.ry=ry;
}

function spawnMoth(color){
  const m=Math.round(Math.min(cw,ch)*0.02);
  const x=m+rng()*(cw-m*2), y=m+rng()*(ch-m*2);
  // 50% chance this moth will move, each with its own random interval (4-7s)
  const willMove = rng()<0.5;
  const nextMove = willMove ? (now() + 3000 + rng()*3000) : Infinity;
  return{color, x, y, rx:x, ry:y,
    tx:x, ty:y, ox:x, oy:y,
    moving:false, moveStart:0,
    angle:(rng()-0.5)*0.3,
    size:MOTH_SIZE*(0.85+rng()*.3),
    willMove, nextMove,
    moveInterval: 4000+rng()*3000};
}

function triggerMove(b){
  if(!gameActive||!b.willMove)return;
  const dist=Math.min(cw,ch)*MOVE_FRAC;
  const ang=rng()*Math.PI*2;
  const m=Math.round(Math.min(cw,ch)*0.02);
  b.ox=b.x; b.oy=b.y;
  b.tx=Math.max(m,Math.min(cw-m, b.x+Math.cos(ang)*dist));
  b.ty=Math.max(m,Math.min(ch-m, b.y+Math.sin(ang)*dist));
  b.moving=true;
  b.moveStart=now();
  b.angle=(rng()-0.5)*0.3;
  // schedule next move
  b.nextMove = now() + b.moveInterval + rng()*2000;
}

function checkMothMoves(){
  if(!gameActive)return;
  const t=now();
  [...whites,...blacks].forEach(b=>{
    if(b.willMove && !b.moving && t>=b.nextMove) triggerMove(b);
  });
}

function drawBird(c2,bird){
  const SEQ=[0,1,2,1];
  const fi=Math.floor(bird.flapPhase*2/Math.PI)%SEQ.length;
  const frame=imgBird[SEQ[Math.abs(fi)%4]];
  const s=bird.size;
  c2.save();
  c2.translate(bird.x,bird.y);
  c2.rotate(bird.drawAngle+Math.PI/2);
  if(frame&&frame.complete&&frame.naturalWidth){
    const hw=s*2.2,hh=s*1.5;
    c2.drawImage(frame,-hw,-hh,hw*2,hh*2);
  }
  c2.restore();
}

function launchBird(tgt){
  if(birds.length>=MAX_BIRDS)return;
  const side=Math.floor(rng()*4);
  let sx,sy;
  if(side===0){sx=rng()*cw;sy=-80;}
  else if(side===1){sx=cw+80;sy=rng()*ch;}
  else if(side===2){sx=rng()*cw;sy=ch+80;}
  else{sx=-80;sy=rng()*ch;}
  birds.push({x:sx,y:sy,tx:tgt.rx,ty:tgt.ry,
    size:MOTH_SIZE*2.2,flapPhase:rng()*Math.PI*2,
    state:'approach',exitVx:0,exitVy:0,drawAngle:0,speed:4.0});
}

function updateBirds(){
  for(let i=birds.length-1;i>=0;i--){
    const b=birds[i]; b.flapPhase+=0.30;
    if(b.state==='approach'){
      const dx=b.tx-b.x,dy=b.ty-b.y,dist=Math.sqrt(dx*dx+dy*dy);
      b.drawAngle=Math.atan2(dy,dx);
      if(dist<22){
        b.state='exit';
        const ang=Math.atan2(b.y-ch/2,b.x-cw/2);
        b.exitVx=Math.cos(ang)*b.speed*1.4;
        b.exitVy=Math.sin(ang)*b.speed*1.4;
      } else {b.x+=dx/dist*b.speed;b.y+=dy/dist*b.speed;}
    } else {
      b.x+=b.exitVx; b.y+=b.exitVy;
      if(b.x<-150||b.x>cw+150||b.y<-150||b.y>ch+150)birds.splice(i,1);
    }
  }
}

function gameLoop(){
  if(!gameActive)return;
  // draw bark background (tile if needed)
  const barkImg=selBg==='dark'?imgDarkBark:imgLightBark;
  if(barkImg.complete&&barkImg.naturalWidth){
    // tile to fill canvas
    const bw=barkImg.naturalWidth, bh=barkImg.naturalHeight;
    const cols=Math.ceil(cw/bw)+1, rows=Math.ceil(ch/bh)+1;
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++)
      ctx.drawImage(barkImg,c*bw,r*bh,bw,bh);
  } else {
    ctx.fillStyle=selBg==='dark'?'#252830':'#c0bdb4';
    ctx.fillRect(0,0,cw,ch);
  }
  checkMothMoves();
  [...whites,...blacks].forEach(b=>drawMoth(ctx,b));
  updateBirds();
  birds.forEach(b=>drawBird(ctx,b));
  document.getElementById('hud-birds').textContent=birds.length+'/3';
  raf=requestAnimationFrame(gameLoop);
}

function hitTest(list,tx,ty){
  for(let i=list.length-1;i>=0;i--){
    const b=list[i];
    const dx=tx-(b.rx??b.x), dy=ty-(b.ry??b.y);
    if(Math.sqrt(dx*dx+dy*dy)<b.size*1.4)return i;
  }
  return -1;
}

function onTap(e){
  if(!gameActive)return; e.preventDefault();
  if(birds.length>=MAX_BIRDS)return;
  const rect=canvas.getBoundingClientRect();
  const sx=cw/rect.width, sy=ch/rect.height;
  const touches=e.touches||[e];
  for(const t of touches){
    const tx=(t.clientX-rect.left)*sx, ty=(t.clientY-rect.top)*sy;
    let idx=hitTest(whites,tx,ty);
    if(idx>=0){const tgt=whites[idx];whites.splice(idx,1);catchW++;launchBird(tgt);updateHUD();continue;}
    idx=hitTest(blacks,tx,ty);
    if(idx>=0){const tgt=blacks[idx];blacks.splice(idx,1);catchB++;launchBird(tgt);updateHUD();}
  }
}

function updateHUD(){
  document.getElementById('hud-w').textContent=whites.length;
  document.getElementById('hud-b').textContent=blacks.length;
}

function startRound(){
  canvas=document.getElementById('gameCanvas');
  const wrap=document.getElementById('canvas-wrap');
  cw=wrap.clientWidth; ch=wrap.clientHeight;
  canvas.width=cw; canvas.height=ch;
  ctx=canvas.getContext('2d');
  whites=Array.from({length:wPool},()=>spawnMoth('white'));
  blacks=Array.from({length:bPool},()=>spawnMoth('black'));
  birds=[]; catchW=0; catchB=0; timer=ROUND_TIME;
  document.getElementById('hud-round').textContent=round+'/5';
  document.getElementById('timer-val').textContent=timer;
  updateHUD(); gameActive=true;
  canvas.addEventListener('click',onTap);
  canvas.addEventListener('touchstart',onTap,{passive:false});
  if(raf)cancelAnimationFrame(raf);
  raf=requestAnimationFrame(gameLoop);

  // move check runs inside gameLoop per-moth

  timerInt=setInterval(()=>{
    timer--;
    document.getElementById('timer-val').textContent=timer;
    if(timer<=0)endRound();
  },1000);
}

function endRound(){
  clearInterval(timerInt);
  gameActive=false; cancelAnimationFrame(raf);
  canvas.removeEventListener('click',onTap);
  canvas.removeEventListener('touchstart',onTap);
  const wR=whites.length, bR=blacks.length;
  roundData.push({round,catchW,catchB,wR,bR});
  document.getElementById('game-screen').style.display='none';
  showResult(wR,bR);
}

function showResult(wR,bR){
  document.getElementById('result-screen').style.display='flex';
  const isLast=round>=TOTAL_ROUNDS;
  document.getElementById('res-title').textContent=isLast?'Experiment complete 🎉':'Round '+round+' complete';
  document.getElementById('res-card').innerHTML=`
    <div class="res-lbl">RoundRound ${round} — Results</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
      <div style="background:#111;border-radius:8px;padding:10px;border:0.5px solid #2a2a2a;">
        <div style="font-size:11px;color:#888;">🤍 Light — caught</div>
        <div style="font-size:22px;font-weight:500;">${catchW}</div>
        <div style="font-size:11px;color:#888;">Remaining: ${wR}</div>
      </div>
      <div style="background:#111;border-radius:8px;padding:10px;border:0.5px solid #2a2a2a;">
        <div style="font-size:11px;color:#888;">🖤 Dark — caught</div>
        <div style="font-size:22px;font-weight:500;">${catchB}</div>
        <div style="font-size:11px;color:#888;">Remaining: ${bR}</div>
      </div>
    </div>
    ${!isLast?`<div style="font-size:12px;color:#888;margin-top:8px;">RoundNext round: Light ${growPop(wR)} / Dark ${growPop(bR)}</div>`:''}
  `;
  const nb=document.getElementById('nextBtn'),rb=document.getElementById('restartBtn'),ss=document.getElementById('sum-section');
  if(isLast){
    nb.style.display='none'; rb.style.display='block'; ss.style.display='block';
    document.getElementById('sum-body').innerHTML=roundData.map(d=>`
      <tr><td>${d.round}</td><td>${d.catchW}</td><td>${d.wR}</td><td>${d.catchB}</td><td>${d.bR}</td></tr>`).join('');
  } else {
    nb.style.display='block'; rb.style.display='none'; ss.style.display='none';
  }
}

function startGame(){
  document.getElementById('setup-screen').style.display='none';
  document.getElementById('game-screen').style.display='flex';
  round=1; roundData=[]; wPool=INIT; bPool=INIT;
  startRound();
}

function growPop(n){
  if(n<=20) return Math.round(n*2.0);
  if(n<=30) return Math.round(n*1.5);
  return Math.round(n*1.25);
}

function nextRound(){
  const last=roundData[roundData.length-1];
  wPool=growPop(last.wR); bPool=growPop(last.bR); round++;
  document.getElementById('result-screen').style.display='none';
  document.getElementById('game-screen').style.display='flex';
  startRound();
}

function restartGame(){
  document.getElementById('result-screen').style.display='none';
  document.getElementById('setup-screen').style.display='flex';
  round=1; roundData=[]; selBg=null;
  document.getElementById('card-light').classList.remove('selected');
  document.getElementById('card-dark').classList.remove('selected');
  const b=document.getElementById('startBtn');
  b.disabled=true; b.textContent='Select an environment first';
}

document.addEventListener('DOMContentLoaded',function(){
  preload();
  document.getElementById('card-light').addEventListener('click',()=>selectBg('light'));
  document.getElementById('card-dark').addEventListener('click',()=>selectBg('dark'));
  document.getElementById('startBtn').addEventListener('click',startGame);
  document.getElementById('nextBtn').addEventListener('click',nextRound);
  document.getElementById('restartBtn').addEventListener('click',restartGame);
});
</script>
