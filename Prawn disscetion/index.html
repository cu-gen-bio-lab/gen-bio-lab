<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ผ่ากุ้งก้ามกรามสามมิติ · ห้องปฏิบัติการเสมือน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bench-1:#e3e9e5; --bench-2:#c9d3cd;
  --panel:rgba(250,252,251,.9); --panel-line:rgba(23,32,29,.12);
  --ink:#17201d; --muted:#56635d;
  --scrub:#0e7c7b; --scrub-ink:#ffffff; --scrub-soft:rgba(14,124,123,.14);
  --cut:#a4161a; --warn:#8a5a00;
  --chip:rgba(23,32,29,.82); --chip-ink:#fff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  font-family:'IBM Plex Sans Thai','Noto Sans Thai','Sukhumvit Set','Leelawadee UI',Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bench-1:#25302c; --bench-2:#131a18;
    --panel:rgba(30,38,35,.9); --panel-line:rgba(233,240,236,.12);
    --ink:#e8efeb; --muted:#9fb0a8;
    --scrub:#3cbfb2; --scrub-ink:#0b1a18; --scrub-soft:rgba(60,191,178,.18);
    --cut:#ff6b6b; --warn:#f2c26b;
    --chip:rgba(240,246,243,.9); --chip-ink:#14201c;
  }
}
:root[data-theme="dark"]{
  --bench-1:#25302c; --bench-2:#131a18;
  --panel:rgba(30,38,35,.9); --panel-line:rgba(233,240,236,.12);
  --ink:#e8efeb; --muted:#9fb0a8;
  --scrub:#3cbfb2; --scrub-ink:#0b1a18; --scrub-soft:rgba(60,191,178,.18);
  --cut:#ff6b6b; --warn:#f2c26b;
  --chip:rgba(240,246,243,.9); --chip-ink:#14201c;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);overflow:hidden;overscroll-behavior:none}
body{height:100%;height:100dvh;margin:0;overflow:hidden;position:fixed;inset:0;overscroll-behavior:none;-webkit-touch-callout:none;color:var(--ink);
  background:radial-gradient(120% 90% at 50% 35%,var(--bench-1),var(--bench-2));
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#c.t-scalpel,#c.t-scissors{cursor:crosshair} #c.t-forceps,#c.t-probe{cursor:grab} #c.t-pins{cursor:copy} #c.t-view{cursor:move}

button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--scrub);outline-offset:2px}

/* top: step card + side controls */
#top{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;display:flex;gap:10px;align-items:flex-start}
.card{background:var(--panel);border:1px solid var(--panel-line);border-radius:16px;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 6px 24px rgba(10,20,16,.12)}
#step{pointer-events:auto;flex:1;max-width:520px;padding:10px 14px 10px}
#step .row{display:flex;align-items:center;gap:10px;width:100%;padding:0;border:0;background:none;text-align:left;cursor:pointer}
#step .chev{margin-left:auto;flex:none;color:var(--muted);transition:transform .2s}
#step.collapsed .chev{transform:rotate(-90deg)}
#step.collapsed #stepText{display:none}
#stepNum{font-size:13px;font-weight:600;color:var(--scrub);white-space:nowrap}
#stepTitle{font-size:17px;font-weight:700;line-height:1.3}
#stepText{margin:4px 0 8px;font-size:14px;line-height:1.55;color:var(--muted)}
#stepText b{color:var(--ink);font-weight:600}
.progrow{display:flex;align-items:center;gap:10px;margin-top:6px}
#chkBtn{display:none;border:1px solid var(--panel-line);background:transparent;border-radius:999px;font-size:12px;padding:2px 9px;cursor:pointer;color:var(--ink);white-space:nowrap}
#step.explore #chkBtn{display:inline-block}
#checklist{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;max-height:34vh;overflow:auto}
#checklist[hidden]{display:none}
#checklist button{font-size:12px;border-radius:999px;padding:3px 9px;border:1px dashed var(--panel-line);background:transparent;color:var(--muted);cursor:pointer}
#checklist button.done{border-style:solid;background:var(--scrub-soft);color:var(--ink)}
#checklist button.done::before{content:"✓ ";color:var(--scrub);font-weight:700}
.prog{flex:1;height:5px;border-radius:3px;background:var(--scrub-soft);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--scrub);border-radius:3px;transition:width .25s}
#progLabel{font-size:12px;color:var(--muted);white-space:nowrap}

#side{pointer-events:auto;margin-left:auto;display:flex;flex-direction:column;gap:8px}
.sbtn{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;cursor:pointer;
  background:var(--panel);border:1px solid var(--panel-line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.sbtn svg{width:22px;height:22px}
.sbtn.on{background:var(--scrub);color:var(--scrub-ink);border-color:transparent}
.sbtn .txt{font-size:18px;font-weight:700;line-height:1}

/* layer panel */
#layerPanel{position:fixed;z-index:7;right:72px;top:calc(env(safe-area-inset-top,0px) + 10px);width:min(290px,calc(100vw - 92px));
  padding:10px 6px 6px;display:none}
#layerPanel.show{display:block}
#layerPanel h4{margin:0 10px 4px;font-size:13px;color:var(--muted);font-weight:600}
.lrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer}
.lrow:hover{background:var(--scrub-soft)}
.lrow .dot{width:12px;height:12px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.15)}
.lrow .txt{flex:1;min-width:0;line-height:1.3}
.lrow .txt b{display:block;font-size:14px;font-weight:600}
.lrow .txt small{font-size:11.5px;color:var(--muted)}
.lrow input{appearance:none;-webkit-appearance:none;width:38px;height:22px;border-radius:11px;background:var(--panel-line);position:relative;flex:none;cursor:pointer;margin:0;transition:background .15s}
.lrow input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.lrow input:checked{background:var(--scrub)}
.lrow input:checked::after{transform:translateX(16px)}
.lrow input:focus-visible{outline:3px solid var(--scrub);outline-offset:2px}
.lsep{height:1px;background:var(--panel-line);margin:4px 10px}
@media (max-width:600px){#layerPanel{right:56px;top:calc(env(safe-area-inset-top,0px) + 8px)}}

/* microscope */
#hots{position:fixed;inset:0;pointer-events:none;z-index:4;display:none}
.hot{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;display:flex;align-items:center;gap:6px;
  border:0;background:none;padding:0;cursor:pointer}
.hot i{width:22px;height:22px;border-radius:50%;background:var(--scrub);border:3px solid #fff;box-shadow:0 0 0 2px var(--scrub),0 2px 6px rgba(0,0,0,.35);position:relative;flex:none}
.hot i::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid var(--scrub);animation:hotp 1.8s ease-out infinite}
@keyframes hotp{from{transform:scale(.6);opacity:.9}to{transform:scale(1.3);opacity:0}}
@media (prefers-reduced-motion:reduce){.hot i::after{animation:none;opacity:.5}}
.hot.left{flex-direction:row-reverse;transform:translate(calc(-100% + 14px),-50%)}
.hot span{font-size:12px;font-weight:600;padding:2px 7px;border-radius:7px;background:var(--chip);color:var(--chip-ink);white-space:nowrap}
#micro{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(8,12,10,.55);
  padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
#micro.show{display:flex}
#micro .mbox{position:relative;width:min(460px,100%);max-height:100%;overflow:auto;padding:14px 16px 14px}
#micro h3{margin:0 40px 0 0;font-size:18px} #micro .en{font-style:italic;color:var(--muted);font-size:13px;margin-left:6px;font-weight:500}
#micro .where{font-size:12px;color:var(--muted);margin:2px 0 10px}
#micro .close{position:absolute;top:8px;right:8px;width:36px;height:36px;border:0;background:transparent;cursor:pointer;color:var(--muted);border-radius:10px}
.mscope{position:relative;width:min(100%,340px);aspect-ratio:1;margin:0 auto;border-radius:50%;overflow:hidden;background:#111;
  box-shadow:0 0 0 8px #1b1f1d,0 0 0 9px #444,inset 0 0 40px rgba(0,0,0,.65);touch-action:none;cursor:grab}
.mscope::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 50px 12px rgba(0,0,0,.55);pointer-events:none}
.lens{position:absolute;inset:0}
.lens .slide{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s ease;transform-origin:50% 50%}
.mags{display:flex;justify-content:center;gap:8px;margin:14px 0 8px}
.mags button{min-width:56px;height:34px;border-radius:17px;border:1px solid var(--panel-line);background:transparent;cursor:pointer;font-weight:600}
.mags button.on{background:var(--scrub);color:var(--scrub-ink);border-color:transparent}
#microDesc{font-size:14px;line-height:1.6;margin:6px 0 8px}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.keys span{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--scrub-soft)}
#microSrc{font-size:11.5px;color:var(--muted)}
@media (max-width:600px){#micro .mbox{padding:12px} .mscope{width:min(100%,300px)} #microDesc{font-size:13px}}

/* bleeding */
body.bleed::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:3;box-shadow:inset 0 0 140px 30px rgba(170,0,12,.6);animation:bleedp .7s ease-in-out infinite alternate}
@keyframes bleedp{from{opacity:.45}to{opacity:1}}
@media (prefers-reduced-motion:reduce){body.bleed::after{animation:none}}

/* toast */
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 76px);transform:translate(-50%,-6px);
  z-index:7;max-width:min(88vw,460px);padding:10px 16px;border-radius:12px;font-size:14px;line-height:1.5;
  background:var(--ink);color:var(--bench-1);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* info sheet */
#info{position:fixed;z-index:6;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 104px);
  max-width:520px;margin:0 auto;padding:14px 16px 14px;display:none}
#info.show{display:block}
#info h3{margin:0;font-size:19px;line-height:1.3;font-weight:700}
#info .en{font-style:italic;color:var(--muted);font-size:14px;margin-left:6px;font-weight:500}
#info p{margin:4px 0 6px;font-size:14px;line-height:1.55}
#info.clamp p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#info .more{display:none;font-size:12px;color:var(--muted);margin-top:2px}
#info.clamp .more{display:block}
#info .move{font-size:13px;color:var(--scrub);font-weight:600;line-height:1.5}
#info.mini{padding:7px 44px 7px 12px;width:auto;right:auto;max-width:min(360px,calc(100% - 16px));cursor:pointer}
#info.mini p,#info.mini .move,#info.mini .more{display:none}
#info.mini h3{font-size:15px}
#info.mini .close{top:2px}
#info .close{position:absolute;top:8px;right:8px;width:36px;height:36px;border:0;background:transparent;cursor:pointer;color:var(--muted);border-radius:10px}
@media (min-width:900px) and (orientation:landscape){
  #info{left:12px;right:auto;width:380px;margin:0;bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
}

/* tool dock: an instrument tray */
#dock{position:fixed;z-index:6;left:50%;bottom:0;transform:translate3d(-50%,0,0);will-change:transform;-webkit-backface-visibility:hidden;
  padding:0 0 calc(env(safe-area-inset-bottom,0px) + 12px);pointer-events:none}
#dock .tray{pointer-events:auto;display:flex;gap:6px;padding:6px}
.tool{width:84px;height:74px;border:0;border-radius:12px;background:transparent;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative}
.tool svg{width:40px;height:30px}
.tool span{font-size:13px;font-weight:600}
.tool.on{background:var(--scrub);color:var(--scrub-ink)}
.tool.suggest:not(.on)::after{content:"";position:absolute;inset:3px;border-radius:10px;border:2px solid var(--scrub);
  animation:ring 1.4s ease-in-out infinite}
@keyframes ring{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.tool.suggest:not(.on)::after{animation:none;opacity:.8}}

/* labels */
#labels{position:fixed;inset:0;pointer-events:none;z-index:4}
.lbl{position:absolute;transform:translate(-50%,-130%);padding:3px 8px;border-radius:8px;font-size:12px;font-weight:600;
  background:var(--chip);color:var(--chip-ink);white-space:nowrap}
.lbl::after{content:"";position:absolute;left:50%;bottom:-4px;width:8px;height:8px;margin-left:-4px;background:var(--chip);transform:rotate(45deg)}

#fail{position:fixed;inset:0;display:none;place-items:center;padding:24px;text-align:center;font-size:16px;line-height:1.6}

@media (max-width:600px){
  #top{padding:calc(env(safe-area-inset-top,0px) + 8px) 8px 0;gap:8px}
  #step{padding:8px 12px;border-radius:14px}
  #stepNum{font-size:12px} #stepTitle{font-size:15px} #stepText{font-size:13px;line-height:1.5}
  #progLabel{font-size:11px}
  #side{gap:6px}
  .sbtn{width:40px;height:40px;border-radius:12px} .sbtn svg{width:19px;height:19px} .sbtn .txt{font-size:16px}
  #dock{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 8px)}
  #dock .tray{padding:4px;gap:4px}
  .tool{width:62px;height:54px;gap:2px;border-radius:10px} .tool svg{width:28px;height:21px} .tool span{font-size:11px}
  #info{left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);padding:9px 40px 9px 12px;border-radius:14px}
  #info h3{font-size:16px} #info .en{font-size:12px} #info p{font-size:13px} #info .move{font-size:12px}
  #info .close{top:4px;right:4px}
}

.sbtn:disabled{opacity:.35;cursor:default}
.lrow .solo{flex:none;border:1px solid var(--panel-line);background:transparent;border-radius:999px;font-size:11.5px;padding:3px 9px;cursor:pointer;color:var(--ink)}
.lrow .solo:hover{background:var(--scrub-soft)}
.lall{display:flex;gap:6px;margin:0 10px 6px}
.lall button{flex:1;border:1px solid var(--panel-line);background:transparent;border-radius:10px;font-size:12.5px;padding:6px 8px;cursor:pointer;color:var(--ink);font-weight:600}
.lall button:hover{background:var(--scrub-soft)}
#layerPanel{max-height:calc(100% - 140px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto}
@media (max-width:600px){.tool{width:56px}}
</style>
</head>
<body>
<canvas id="c" class="t-view" tabindex="0" aria-label="โมเดลกุ้งก้ามกรามสามมิติ วางคว่ำบนถาดผ่าตัด"></canvas>
<div id="labels"></div>

<div id="top">
  <section id="step" class="card" aria-live="polite">
    <button class="row" id="stepHead" aria-expanded="true" aria-controls="stepText">
      <span id="stepNum">1/3</span><span id="stepTitle"></span>
      <svg class="chev" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <p id="stepText"></p>
    <div class="progrow"><div class="prog"><i id="progBar"></i></div><span id="progLabel"></span><button id="chkBtn" aria-expanded="false" aria-controls="checklist">รายการ ▾</button></div>
    <div id="checklist" hidden></div>
  </section>
  <div id="side">
    <button class="sbtn" id="btnView" aria-label="เปลี่ยนมุมมอง" title="เปลี่ยนมุมมอง">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/><circle cx="12" cy="12" r="2.5"/></svg>
    </button>
    <button class="sbtn" id="btnLabels" aria-label="แสดงป้ายชื่ออวัยวะ" title="ป้ายชื่ออวัยวะ" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 12V4h8l10 10-8 8L3 12z"/><circle cx="7.5" cy="8" r="1.5"/></svg>
    </button>
    <button class="sbtn" id="btnLayers" aria-label="เลือกระบบที่แสดง" title="ชั้นและระบบที่แสดง" aria-expanded="false" aria-controls="layerPanel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg>
    </button>
    <button class="sbtn" id="btnSex" aria-label="สลับเพศของกุ้ง" title="สลับเพศ: ตัวผู้"><span class="txt" id="sexTxt">♂</span></button>
    <button class="sbtn" id="btnUndo" aria-label="ย้อนกลับ 1 ขั้น" title="ย้อนกลับ 1 ขั้น" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
    </button>
    <button class="sbtn" id="btnRestart" aria-label="เริ่มผ่าใหม่" title="เริ่มผ่าใหม่">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4"/></svg>
    </button>
  </div>
</div>

<section id="layerPanel" class="card" aria-label="ชั้นและระบบที่แสดง"><h4>ชั้นและระบบที่แสดง</h4><div id="layerList"></div><p style="margin:8px 0 0 10px;font-size:11px;opacity:.55">ผ่ากุ้งก้ามกราม · เวอร์ชัน 6 (2026-10-26)</p></section>
<div id="toast" role="status"></div>

<section id="info" class="card" aria-live="polite">
  <button class="close" id="infoClose" aria-label="ปิด">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <h3><span id="infoTh"></span><span class="en" id="infoEn"></span></h3>
  <p id="infoDesc"></p>
  <div class="move" id="infoMove"></div>
  <div class="more">แตะเพื่ออ่านต่อ</div>
</section>

<nav id="dock" aria-label="เครื่องมือ">
  <div class="tray card">
    <button class="tool on" data-tool="view" aria-label="มุมมอง">
      <svg viewBox="0 0 40 30" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="20" cy="15" rx="15" ry="7"/><path d="M31 6l4 3-4 3"/><circle cx="20" cy="15" r="2.4"/></svg>
      <span>มุมมอง</span>
    </button>
    <button class="tool" data-tool="scissors" aria-label="กรรไกร">
      <svg viewBox="0 0 40 30" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="4.5"/><circle cx="8" cy="22" r="4.5"/><path d="M12 10l24 11M12 20l24-11"/></svg>
      <span>กรรไกร</span>
    </button>
    <button class="tool" data-tool="pins" aria-label="เข็มหมุด">
      <svg viewBox="0 0 40 30" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="20" cy="7" r="4.5" fill="currentColor" fill-opacity=".3"/><path d="M20 11.5v12"/><path d="M8 25h24"/></svg>
      <span>เข็มหมุด</span>
    </button>
    <button class="tool" data-tool="forceps" aria-label="ปากคีบ">
      <svg viewBox="0 0 40 30" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9c10 1 22 4 34 5M3 21c10-1 22-4 34-5"/><path d="M3 9v12"/></svg>
      <span>ปากคีบ</span>
    </button>
    <button class="tool" data-tool="probe" aria-label="เข็มเขี่ย">

const cam={target:new V3(1.2,.5,0),theta:.45,phi:.78,r:15};let tween=null,viewIdx=0;
function fitR(kind){const a=camera.aspect||1,v=2*Math.tan(camera.fov*PI/360);
  if(kind==='top')return clamp(Math.max(5.2/v,9.4/(v*a)),4,30);
  if(kind==='side')return clamp(Math.max(3.4/v,9.4/(v*a)),4,30);
  return clamp(Math.max(8/v,12.6/(v*a)),6,40);}
function viewPreset(kind){
  if(kind==='top')return {target:new V3(-.2,.6,0),theta:0,phi:.1,r:fitR('top')};
  if(kind==='side')return {target:new V3(-.2,.7,0),theta:0,phi:1.3,r:fitR('side')};
  return {target:new V3(1.4,.4,0),theta:.45,phi:.78,r:fitR('full')};}
function goView(kind,instant){const p=viewPreset(kind);if(instant){cam.target.copy(p.target);cam.theta=p.theta;cam.phi=p.phi;cam.r=p.r;tween=null;return;}
  const dt=((p.theta-cam.theta+PI)%(2*PI)+2*PI)%(2*PI)-PI;tween={t0:performance.now(),dur:900,from:{target:cam.target.clone(),theta:cam.theta,phi:cam.phi,r:cam.r},to:Object.assign(p,{theta:cam.theta+dt})};}
function updateCam(){const s=Math.sin(cam.phi);camera.position.set(cam.target.x+cam.r*s*Math.sin(cam.theta),cam.target.y+cam.r*Math.cos(cam.phi),cam.target.z+cam.r*s*Math.cos(cam.theta));camera.lookAt(cam.target);}

const rc=new THREE.Raycaster();

function cast(x,y,objs){rc.setFromCamera(ndc(x,y),camera);const h=rc.intersectObjects(objs,false);return h[0]||null;}
function rayPlane(x,y,point,normal){rc.setFromCamera(ndc(x,y),camera);const pl=new THREE.Plane().setFromNormalAndCoplanarPoint(normal,point),o=new V3();return rc.ray.intersectPlane(pl,o)?o:null;}
function visibleDeep(o){while(o){if(!o.visible)return false;o=o.parent;}return true;}
function toScreen(v){const p=v.clone().project(camera),r=canvas.getBoundingClientRect();return {x:(p.x+1)/2*r.width,y:(1-p.y)/2*r.height,z:p.z};}

const pointers=new Map();let action=null,gesture=null,lastWarn=0;

  if(pointers.size===2){endAction();const [a,b]=[...pointers.values()];gesture={d:Math.hypot(a.x-b.x,a.y-b.y),m:{x:(a.x+b.x)/2,y:(a.y+b.y)/2}};}
  else if(pointers.size===1)startAction(e);});

  if(gesture&&pointers.size>=2){const [a,b]=[...pointers.values()];const d=Math.hypot(a.x-b.x,a.y-b.y)||1,m={x:(a.x+b.x)/2,y:(a.y+b.y)/2};

const FLOW=[{key:'cut',tool:'scissors',ok:['scissors']},{key:'open',tool:'pins',ok:['pins','forceps','probe']},{key:'explore',tool:'forceps',ok:['forceps','probe','scalpel']}];
const EXPLORE=2,TOOLNAME={scalpel:'มีดผ่าตัด',scissors:'กรรไกร',forceps:'ปากคีบ',probe:'เข็มเขี่ย',pins:'เข็มหมุด'};
function wrongToolMsg(){return state.step===0?(state.tool==='scalpel'?'เปลือกกุ้งแข็ง ต้องใช้กรรไกรตัด ไม่ใช้มีดผ่าตัด':'ขั้นนี้ใช้กรรไกรตัดเปลือกตามเส้นประก่อน'):state.step===1?'ขั้นนี้ใช้เข็มหมุดแตะเปลือกเพื่อพลิกออกและปัก (หรือใช้ปากคีบพลิกเอง)':'ใช้ปากคีบหรือเข็มเขี่ยศึกษาอวัยวะ · มีดผ่าตัดใช้เลาะกล้ามเนื้อส่วนท้อง';}
const nearFront=pt=>Math.abs(pt.z)<.28&&pt.x<=cutFront+.25&&pt.x>=cutFront-.6;
function startAction(e){
  const p={x:e.clientX,y:e.clientY},id=e.pointerId,tool=state.tool;scene.updateMatrixWorld();
  if(e.pointerType==='mouse'&&e.button!==0){action={type:'pan',id,last:p};return;}
  if(tool!=='view'){
    if(!FLOW[state.step].ok.includes(tool)){toast(wrongToolMsg());}
    else if(tool==='scissors'){const h=cast(p.x,p.y,shellMeshes());
      if(h&&nearFront(h.point)){snap();action={type:'cut',id,last:p,off:0,snap:true};doCut(h.point);if(action)showTool('scissors',h.point);return;}
      if(h)toast(cutFront>=CUT_START-1e-3?'เริ่มตัดที่จุดแดงบนหลังส่วนหัว แล้วลากตามเส้นประไปทางหาง':'ตัดต่อจากจุดแดง ตามเส้นประไปทางหาง');
      action={type:'cutPending',id,last:p,start:p};return;}
    else if(tool==='pins'){const h=cast(p.x,p.y,shellMeshes()),s=h&&h.object.userData.shell;
      if(s){if(s.pinned)toast('เปลือกชิ้นนี้ปักหมุดไว้แล้ว');else{snap();pinFlap(s);}action={type:'none',id,last:p};return;}}
    else if(tool==='scalpel'){const h=cast(p.x,p.y,pickList()),o=h&&h.object.userData.organ;
      if(h&&o&&onMusLine(h.point)){snap();action={type:'mus',id,last:p,xmin:h.point.x,xmax:h.point.x,snap:true,plane:V(0,musTopY(h.point.x),0)};showMusScalpel(V(h.point.x,musTopY(h.point.x),MUS_TILT));return;}
      if(o){showTool('scalpel',h.point);toast(o.muscle?'กรีดตามเส้นประบนกล้ามเนื้อ ลากมีดยาวตลอดแนวส่วนท้อง':'ระวัง อย่ากรีดอวัยวะ ใช้ปากคีบหรือเข็มเขี่ยแทน');action={type:'none',id,last:p};return;}
      if(h&&h.object.userData.shell){toast('เปลือกพลิกออกแล้ว ใช้มีดเลาะกล้ามเนื้อส่วนท้อง');}}
    else{ /* forceps / probe */
      const h=cast(p.x,p.y,pickList());
      if(h){const s=h.object.userData.shell,o=h.object.userData.organ;
        if(s){if(tool==='probe'){showInfo('shell');showTool('probe',h.point);action={type:'none',id,last:p};return;}
          if(s.pinned){toast('เปลือกชิ้นนี้ปักหมุดไว้แล้ว · ถอนหมุดได้ด้วยปุ่มย้อนกลับ');action={type:'none',id,last:p};return;}
          snap();s.grab=true;action={type:'flap',s,id,last:p,start:p,o0:s.open,snap:true};showTool('forceps',h.point,true);return;}
        if(o){select(o);showInfo(o.key);o.grab=true;o.lim=o.maxD*(tool==='probe'?.5:1);
          action={type:'organ',o,tool,id,last:p,plane:h.point.clone(),normal:camDir(),p0:h.point.clone().sub(o.g.position)};showTool(tool,h.point,true);return;}}}}
  action={type:'orbit',id,last:p};}
function moveAction(e){
  const p={x:e.clientX,y:e.clientY},dx=p.x-action.last.x,dy=p.y-action.last.y;
  if(action.type==='mus'){const t=rayPlane(p.x,p.y,action.plane,UP);if(t&&onMusLine(t)){const x=clamp(t.x,MUS_X1,MUS_X0);action.xmin=Math.min(action.xmin,x);action.xmax=Math.max(action.xmax,x);showMusScalpel(V(x,musTopY(x),MUS_TILT));}}

    if(h&&nearFront(h.point)){snap();action={type:'cut',id:action.id,last:p,off:0,snap:true};doCut(h.point);if(action)showTool('scissors',h.point);return;}
    if(Math.hypot(p.x-action.start.x,p.y-action.start.y)>28)action.type='orbit';}
  if(action.type==='orbit'){cam.theta-=dx*.0075;cam.phi=clamp(cam.phi-dy*.0075,.06,1.45);tween=null;}
  else if(action.type==='pan')pan(dx,dy);
  else if(action.type==='cut'){const h=cast(p.x,p.y,shellMeshes());if(h){doCut(h.point);if(action)showTool('scissors',h.point);}else tools.scissors.visible=false;}
  else if(action.type==='flap'){action.s.open=clamp(action.o0+Math.hypot(p.x-action.start.x,p.y-action.start.y)/180,0,1);
    action.s.hinge.rotation.x=action.s.side*action.s.open*action.s.maxAng;action.s.m.updateMatrixWorld(true);showTool('forceps',action.s.m.localToWorld(action.s.pinLocal.clone()),true);}
  else if(action.type==='organ'){const o=action.o,t=rayPlane(p.x,p.y,action.plane,action.normal);
    if(t){const d=t.sub(action.p0),L=d.length();
      if(L>o.lim){d.multiplyScalar(o.lim/L);if(L>o.lim*2.5&&performance.now()-lastWarn>2200){lastWarn=performance.now();toast(INFO[o.key].th+' ยังยึดติดกับเนื้อเยื่อ ขยับได้เพียงเล็กน้อย ดึงออกจากตัวไม่ได้');}}
      o.g.position.copy(d);showTool(action.tool,action.p0.clone().add(d),true);}}
  if(action)action.last=p;}
function endAction(){if(!action)return;
  if(action.type==='mus')finishMusStroke(action);
  if(action.snap&&hist.length&&hist[hist.length-1].key===stateKey()){hist.pop();updateUndo();}
  if(action.o)action.o.grab=false;if(action.s)action.s.grab=false;action=null;hideTools();}
function doCut(pt){
  if(Math.abs(pt.z)<.3&&pt.x<cutFront&&pt.x>cutFront-.6){cutFront=Math.max(CUT_END,pt.x);updateCut();action.off=0;
    try{navigator.vibrate&&navigator.vibrate(4);}catch(_){}updateHUD();if(cutFront<=CUT_END+1e-3)finishCut();}
  else if(Math.abs(pt.z)>.3){action.off++;if(action.off>10&&performance.now()-lastWarn>2500){lastWarn=performance.now();toast('ลากกรรไกรให้ตรงตามแนวเส้นประ');action.off=0;}}}
function finishCut(){endAction();state.step=1;setTool('pins',true);goView('top');
  toast('ตัดเปลือกครบแล้ว ต่อไปเลือกเข็มหมุด แตะเปลือกทีละชิ้นเพื่อพลิกออกและปักไว้กับถาด');updateHUD();
  try{navigator.vibrate&&navigator.vibrate(20);}catch(_){}}
function pinFlap(s){
  const r0=s.hinge.rotation.x;s.hinge.rotation.x=s.side*s.maxAng;s.hinge.updateMatrixWorld(true);
  const p=s.m.localToWorld(s.pinLocal.clone());s.hinge.rotation.x=r0;s.hinge.updateMatrixWorld(true);
  s.pinned=true;
  const g=new THREE.Group();g.position.set(p.x,0,p.z);const top=p.y+.3;
  const sh=new THREE.Mesh(new THREE.CylinderGeometry(.013,.013,top+.12,6),MAT.steel);sh.position.y=(top-.12)/2;sh.castShadow=true;
  const hd=new THREE.Mesh(new THREE.SphereGeometry(.055,12,10),MAT.pinHead);hd.position.y=top;hd.castShadow=true;g.add(sh,hd);g.userData.delay=performance.now();
  g.position.y=3;g.userData.t0=performance.now();prawn.add(g);pins.push(g);
  const left=shells.filter(x=>!x.pinned).length;
  if(left){toast('ปักหมุดแล้ว เหลือเปลือกอีก '+left+' ชิ้น');updateHUD();}
  else{state.step=EXPLORE;setTool('forceps',true);goView('top');
    toast('เปิดเปลือกครบแล้ว ใช้ปากคีบแตะค้างที่อวัยวะเพื่อคีบ ขยับได้เล็กน้อยแล้วอวัยวะจะกลับที่เดิม');updateHUD();}}

/* ================= HUD ================= */
const STEPS=[
  {title:'ตัดเปลือกตามแนวกลางหลัง',text:'เลือก <b>กรรไกร</b> วางนิ้วที่<b>จุดแดง</b>บนหลังส่วนหัว แล้วลากตาม<b>เส้นประ</b>ไปทางหางจนถึงปล้องที่ 6 · งัดปลายกรรไกรขึ้นเสมอ เพราะหัวใจอยู่ชิดใต้เปลือก'},
  {title:'เปิดเปลือกและปักหมุด',text:'เลือก <b>เข็มหมุด</b> แล้วแตะเปลือกทีละชิ้น เปลือกจะพลิกออกด้านข้างและถูกปักไว้กับถาด · หรือใช้ <b>ปากคีบ</b> ลากพลิกเปลือกดูก่อนปัก'},
  {title:'ศึกษาอวัยวะในตำแหน่งเดิม',text:'<b>ปากคีบ</b> แตะค้างที่อวัยวะเพื่อคีบ ขยับได้เล็กน้อยแล้วกลับที่เดิม (ดึงออกจากตัวไม่ได้) · <b>เข็มเขี่ย</b> แตะอ่านข้อมูล · <b>มีดผ่าตัด</b> กรีดตามเส้นประบนกล้ามเนื้อส่วนท้อง 2–3 ครั้ง ลึกลงจนถึงเส้นประสาทด้านท้อง · เปิดปิดแต่ละระบบได้ที่ปุ่มชั้น'}];
let lastStep=-1,stepTimer=0;const narrow=()=>window.innerWidth<700;
function setStepOpen(open){$('step').classList.toggle('collapsed',!open);$('stepHead').setAttribute('aria-expanded',open);}
function openStep(auto){setStepOpen(true);clearTimeout(stepTimer);if(auto&&narrow())stepTimer=setTimeout(()=>setStepOpen(false),6000);}
function updateHUD(){
  const s=STEPS[state.step];$('stepNum').textContent=(state.step+1)+'/3';if(state.step!==lastStep){lastStep=state.step;openStep(true);}
  $('stepTitle').textContent=s.title;$('stepText').innerHTML=s.text;let frac=0,lbl='';
  if(state.step===0){frac=cutFrac();lbl='ตัดแล้ว '+Math.round(frac*100)+'%';}
  else if(state.step===1){const n=shells.filter(x=>x.pinned).length;frac=n/shells.length;lbl='ปักหมุดแล้ว '+n+' จาก '+shells.length+' ชิ้น';}
  else{const keys=keysFor(state.sex),n=keys.filter(k=>state.seen.has(k)).length;frac=n/keys.length;lbl='ศึกษาแล้ว '+n+' จาก '+keys.length+' อวัยวะ';
    if(n===keys.length&&!state.allSeenToast){state.allSeenToast=true;setTimeout(()=>toast('ศึกษาอวัยวะครบแล้ว ลองสลับเพศของกุ้งเพื่อดูอวัยวะสืบพันธุ์อีกแบบ'),600);}}
  $('progBar').style.width=Math.round(frac*100)+'%';$('progLabel').textContent=lbl;
  const ex=state.step===EXPLORE;$('step').classList.toggle('explore',ex);
  if(!ex){$('checklist').hidden=true;$('chkBtn').setAttribute('aria-expanded',false);}
  else{const cl=$('checklist');cl.innerHTML='';keysFor(state.sex).forEach(k=>{const b=document.createElement('button'),done=state.seen.has(k);b.textContent=INFO[k].th;b.className=done?'done':'';
    b.addEventListener('click',()=>{if(done)showInfo(k);else toast(k==='nerve'?'เส้นประสาทอยู่ใต้กล้ามเนื้องอ เลือกมีดผ่าตัดแล้วกรีดตามเส้นประบนกล้ามเนื้อจนถึงเส้นประสาท':'ยังไม่ได้ศึกษา '+INFO[k].th+' ลองหาแล้วคีบดู');});cl.appendChild(b);});}
  document.querySelectorAll('.tool').forEach(b=>b.classList.toggle('suggest',b.dataset.tool===FLOW[state.step].tool));}
let toastTimer=0,infoTimer=0;
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2800);}
function showInfo(key){const i=INFO[key];if(!i)return;$('infoTh').textContent=i.th;$('infoEn').textContent=i.en;$('infoDesc').textContent=i.desc;$('infoMove').textContent=i.move;
  $('info').classList.add('show');$('info').classList.remove('mini');$('info').classList.toggle('clamp',narrow());
  if(key!=='shell'){state.seen.add(key);updateHUD();}
  clearTimeout(infoTimer);infoTimer=setTimeout(()=>$('info').classList.add('mini'),narrow()?2500:5000);}
/* move the tray in the screen plane (two-finger drag, or right-drag with a mouse) */
function pan(dx,dy){const h=canvas.clientHeight||window.innerHeight,k=2*cam.r*Math.tan(camera.fov*PI/360)/h;
  camera.updateMatrixWorld();const right=new V3().setFromMatrixColumn(camera.matrixWorld,0),upv=new V3().setFromMatrixColumn(camera.matrixWorld,1);
  cam.target.addScaledVector(right,-dx*k).addScaledVector(upv,dy*k);
  cam.target.set(clamp(cam.target.x,-7,9),clamp(cam.target.y,-3,4),clamp(cam.target.z,-6,6));tween=null;}
function hideInfo(){$('info').classList.remove('show');clearSel();}
function select(o){clearSel();selected=o;o.meshes.forEach(m=>m.material.emissive&&m.material.emissive.setHex(0x2a2a2a));}
function clearSel(){if(selected)selected.meshes.forEach(m=>m.material.emissive&&m.material.emissive.setHex(0));selected=null;}
function setTool(t,silent){state.tool=t;document.querySelectorAll('.tool').forEach(b=>{const on=b.dataset.tool===t;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);});
  canvas.className='t-'+t;if(silent)return;if(TOOLNAME[t]&&!FLOW[state.step].ok.includes(t))toast(wrongToolMsg());updateHUD();}
function applySex(){$('sexTxt').textContent=state.sex==='male'?'♂':'♀';$('btnSex').title='สลับเพศ: '+(state.sex==='male'?'ตัวผู้':'ตัวเมีย');applyLayers();}

document.querySelectorAll('.tool').forEach(b=>b.addEventListener('click',()=>setTool(b.dataset.tool)));
const VIEWS=[['full','มุมมองรวม'],['top','มุมบน'],['side','มุมข้าง']];
$('btnView').addEventListener('click',()=>{viewIdx=(viewIdx+1)%VIEWS.length;goView(VIEWS[viewIdx][0]);toast(VIEWS[viewIdx][1]);});
$('btnLabels').addEventListener('click',()=>{state.labels=!state.labels;$('btnLabels').classList.toggle('on',state.labels);$('btnLabels').setAttribute('aria-pressed',state.labels);
  if(state.labels&&state.step<EXPLORE&&!layerOn.ghost)toast('ป้ายชื่อจะแสดงเมื่อเปิดเปลือกแล้ว หรือเปิด “เปลือกโปร่งแสง” ในเมนูชั้น');});
$('btnSex').addEventListener('click',()=>{state.sex=state.sex==='male'?'female':'male';if(selected&&selected.sex)hideInfo();applySex();state.allSeenToast=false;updateHUD();
  toast(state.sex==='male'?'กุ้งตัวผู้: อัณฑะสีขาวครีม ท่อนำอสุจิเปิดที่โคนขาคู่ที่ 5':'กุ้งตัวเมีย: รังไข่สีส้ม ท่อนำไข่เปิดที่โคนขาคู่ที่ 3');});
$('btnUndo').addEventListener('click',()=>undo());
$('btnRestart').addEventListener('click',()=>{endAction();build();goView('full');viewIdx=0;toast('เริ่มผ่าใหม่');});
{const r=document.createElement('div');r.className='lall';r.innerHTML='<button id="lyAll">แสดงทั้งหมด</button><button id="lyIn">ซ่อนเปลือก</button>';$('layerList').appendChild(r);}
LAYERS.forEach(L=>{if(L.sep){const sp=document.createElement('div');sp.className='lsep';$('layerList').appendChild(sp);}
  const row=document.createElement('label');row.className='lrow';
  row.innerHTML=(L.dot?`<span class="dot" style="background:${L.dot}"></span>`:'<span class="dot" style="background:transparent;border-style:dashed"></span>')+
    `<span class="txt"><b>${L.th}</b><small>${L.sub}</small></span>`+(SYSIDS.includes(L.id)?`<button class="solo" type="button">เดี่ยว</button>`:'')+`<input type="checkbox" data-layer="${L.id}" aria-label="${L.th}">`;
  row.querySelector('input').addEventListener('change',e=>setLayer(L.id,e.target.checked));
  const sb=row.querySelector('.solo');if(sb)sb.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();soloLayer(L.id);});
  $('layerList').appendChild(row);});
$('lyAll').addEventListener('click',allLayers);
$('lyIn').addEventListener('click',()=>{layerOn.exo=false;applyLayers();});
$('btnLayers').addEventListener('click',()=>{const open=!$('layerPanel').classList.contains('show');$('layerPanel').classList.toggle('show',open);$('btnLayers').classList.toggle('on',open);$('btnLayers').setAttribute('aria-expanded',open);});
canvas.addEventListener('pointerdown',()=>{
  if(narrow()){if($('info').classList.contains('show')){clearTimeout(infoTimer);$('info').classList.add('mini');}clearTimeout(stepTimer);setStepOpen(false);}
  if($('layerPanel').classList.contains('show')){$('layerPanel').classList.remove('show');$('btnLayers').classList.remove('on');$('btnLayers').setAttribute('aria-expanded',false);}},true);
$('chkBtn').addEventListener('click',e=>{e.stopPropagation();const c=$('checklist');c.hidden=!c.hidden;$('chkBtn').setAttribute('aria-expanded',!c.hidden);$('chkBtn').textContent=c.hidden?'รายการ ▾':'ซ่อน ▴';setStepOpen(true);});
$('infoClose').addEventListener('click',e=>{e.stopPropagation();hideInfo();});
$('info').addEventListener('click',()=>{const el=$('info');clearTimeout(infoTimer);if(el.classList.contains('mini')){el.classList.remove('mini');el.classList.remove('clamp');}else el.classList.toggle('clamp');});
$('stepHead').addEventListener('click',()=>{clearTimeout(stepTimer);setStepOpen($('step').classList.contains('collapsed'));});

/* ================= labels ================= */
function updateLabels(){const show=state.labels&&(state.step>=EXPLORE||layerOn.ghost);
  organs.forEach(o=>{if(!o.el)return;if(!show||!visibleDeep(o.g)){o.el.style.display='none';return;}
    const p=o.anchor.clone().add(o.g.position);p.y+=.14;const s=toScreen(p);if(s.z>1){o.el.style.display='none';return;}
    o.el.style.display='block';o.el.style.left=s.x+'px';o.el.style.top=s.y+'px';});}

/* ================= loop ================= */
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;
  if(tween){const u=clamp((now-tween.t0)/tween.dur,0,1),k=ease(u),f=tween.from,t=tween.to;cam.target.lerpVectors(f.target,t.target,k);cam.theta=f.theta+(t.theta-f.theta)*k;cam.phi=f.phi+(t.phi-f.phi)*k;cam.r=f.r+(t.r-f.r)*k;if(u>=1)tween=null;}
  updateCam();
  if(tools.scissors.visible){const a=(action&&action.type==='cut')?.04+.2*(.5+.5*Math.sin(now/75)):.12;tools.scissors.userData.halves.forEach(h=>h.rotation.z=h.userData.s*a);}
  organs.forEach(o=>{if(o.grab)return;const p=o.g.position;if(p.lengthSq()<1e-9&&o.vel.lengthSq()<1e-9)return;
    o.vel.addScaledVector(p,-60*dt).multiplyScalar(Math.exp(-8*dt));p.addScaledVector(o.vel,dt);});
  let anyOpen=false;
  shells.forEach(s=>{if(s.pinned)s.open+=(1-s.open)*Math.min(1,dt*5);
    else if(!s.grab){const tg=state.step>=1?Math.min(s.open,.3):0;s.open+=(tg-s.open)*Math.min(1,dt*4);}
    s.hinge.rotation.x=s.side*s.open*s.maxAng;if(s.open>.4)anyOpen=true;});
  pins.forEach(g=>{if(g.position.y>0){const u=clamp((now-g.userData.t0)/450,0,1);g.position.y=3*(1-u*u);}});
  const musOn=state.step===EXPLORE&&state.tool==='scalpel'&&layerOn.mus&&musStrokes<3;musDash.forEach(m=>m.visible=musOn);
  {const tg=musStrokes;if(Math.abs(musOpen-tg)>1e-4){musOpen+=(tg-musOpen)*Math.min(1,dt*2.2);if(Math.abs(musOpen-tg)<.004)musOpen=tg;musDeform();}}
  if(musDash.length&&musDash._s!==musStrokes){musDash._s=musStrokes;placeMusDash();}
  const guideOn=state.step===0&&layerOn.exo;dashes.forEach(m=>m.visible=guideOn&&m.userData.x<=cutFront+.01);marker.visible=guideOn&&cutFront>CUT_END+.02;
  if(cutMesh)cutMesh.visible=layerOn.exo&&state.step===0;
  if(guideOn||musOn)MAT.dash.color.lerpColors(DASH_A,DASH_B,.5+.5*Math.sin(now/260));
  if(guideOn){marker.scale.setScalar(1+.4*Math.abs(Math.sin(now/260)));}
  updateLabels();renderer.render(scene,camera);}
window.addEventListener('resize',()=>{resize();});
function relayout(){resize();const d=$('dock');d.style.display='none';void d.offsetHeight;d.style.display='';}
if(window.visualViewport)visualViewport.addEventListener('resize',relayout);
window.addEventListener('orientationchange',()=>setTimeout(relayout,250));
window.addEventListener('pageshow',()=>setTimeout(relayout,60));
[120,500,1200].forEach(t=>setTimeout(relayout,t));
resize();build();goView('full',true);requestAnimationFrame(frame);
setTimeout(()=>toast('เริ่มจากเลือกกรรไกรในถาดเครื่องมือด้านล่าง · ใช้สองนิ้วลากเพื่อเลื่อนถาด หยิกเพื่อซูม'),700);
})();
</script>
